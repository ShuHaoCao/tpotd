<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>班表表格線上版</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        overflow: hidden;
      }
      body {
        font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      }
      #viewport {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 62px;
        bottom: 14px;
        overflow: hidden;
        background: #fff;
      }
      #sheet {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1137px;
        height: 685px;
        transform-origin: center center;
      }
      #canvas {
        position: relative;
        width: 1137px;
        height: 685px;
        background: #fff;
      }
      .cell {
        position: absolute;
        margin: 0;
        padding: 4px;
        border: 1px solid #000;
        background: #fff;
        color: #000;
        overflow: hidden;
        outline: 0;
        font-size: 14px;
        line-height: 1.2;
      }
      .cell:focus {
        box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.18);
      }
      @media print {
        @page {
          size: landscape;
          margin: 8mm;
        }
        html,
        body,
        #viewport,
        #canvas,
        .cell {
          background: #fff !important;
        }
        html,
        body {
          overflow: visible;
        }
        #viewport {
          inset: 0;
        }
      }

      /* ===== 固定標題排版 ===== */
      .cell {
        padding: 0;
      }

      .fixed-label {
        width: 100%;
        height: 100%;
        font-weight: 700;
        color: #000;
        user-select: none;
        box-sizing: border-box;
      }

      /* 橫向文字：第一字與最後一字固定在左右端，其他字平均分散 */
      .horizontal {
        display: flex;
        align-items: center;
        justify-content: space-between;
        white-space: nowrap;
        padding: 0 10px;
      }

      /* 直向文字：
         所有同列標題使用相同的上下內距，
         第一個字上緣切齊、最後一個字下緣切齊，
         中間字平均分散。 */
      .vertical {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
      }

      .horizontal span,
      .vertical span,
      .vertical-col span {
        display: block;
        flex: 0 0 auto;
        line-height: 1;
      }

      /* 「陪產照顧」：兩欄並排，但兩欄的文字高度與上下基準完全一致 */
      .vertical-pair {
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 5px;
        padding: 10px 5px;
      }

      .vertical-col {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
      }

      /* ===== 排班資料控制列（不影響表格幾何） ===== */
      #scheduleControls {
        position: fixed;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 6px 12px;
        background: #fff;
        border: 1px solid #bbb;
        border-radius: 6px;
        font-size: 14px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        white-space: nowrap;
      }

      #scheduleControls .info-item {
        color: #333;
      }

      #scheduleControls .info-item + .info-item {
        padding-left: 10px;
        border-left: 1px solid #d2d2d2;
      }

      #weekdayDisplay {
        min-width: 48px;
        font-weight: 700;
      }

      #scheduleControls input[type="date"] {
        font: inherit;
        padding: 3px 6px;
      }

      #scheduleControls button {
        font: inherit;
        padding: 3px 8px;
        cursor: pointer;
      }

      #weekdayDisplay,
      #scheduledCount,
      #offdayCount,
      #totalCount {
        color: #333;
      }

      /* JSON 動態寫入的姓名：
         左右置中、垂直靠下、底部保留少量空白，
         字體盡量放大並使用藍紫色。 */
      .schedule-name {
        position: absolute;
        left: 0;
        bottom: 5px;
        width: 100%;
        height: auto;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-direction: column;
        padding: 0 2px;
        box-sizing: border-box;
        font-weight: 700;
        font-size: 24px;
        line-height: 1.02;
        color: #3657c8;
        text-align: center;
        pointer-events: none;
        user-select: none;
        z-index: 2;
      }

      .schedule-name span {
        display: block;
        line-height: 1.02;
      }

      @media print {
        #scheduleControls {
          display: none !important;
        }
      }

      /* ===== offday.json 動態寫入的假別姓名 ===== */
      .offday-name {
        position: absolute;
        left: 0;
        bottom: 5px;
        width: 100%;
        height: auto;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-direction: column;
        padding: 0 2px;
        box-sizing: border-box;
        font-weight: 700;
        font-size: 24px;
        line-height: 1.02;
        color: #3657c8;
        text-align: center;
        pointer-events: none;
        user-select: none;
        z-index: 2;
      }

      .offday-name span {
        display: block;
        line-height: 1.02;
      }
    </style>
  </head>

            })
            .filter((v) => v && v !== "-");
        }

        if (typeof value === "string") {
          const s = value.trim();
          return s && s !== "-" ? [s] : [];
        }

        return [];
      }

      function clearOffdayNames() {
        document.querySelectorAll(".offday-name").forEach((el) => el.remove());
      }

      function addOffdayNameToCell(cellNo, name) {
        const cell = getCell(cellNo);
        if (!cell || !name) return;

        const box = document.createElement("div");
        box.className = "offday-name";

        Array.from(name).forEach((ch) => {
          const span = document.createElement("span");
          span.textContent = ch;
          box.appendChild(span);
        });

        cell.appendChild(box);
      }

      function getDateWeekday(dateText) {
        // 用本地時間中午解析，避免 YYYY-MM-DD 被 UTC 時區換日。
        const [y, m, d] = dateText.split("-").map(Number);
        return new Date(y, m - 1, d, 12, 0, 0).getDay();
      }

      function updateSummary(date, scheduled, offday) {
        const weekdayNames = [
          "星期日",
          "星期一",
          "星期二",
          "星期三",
          "星期四",
          "星期五",
          "星期六",
        ];
        if (weekdayEl) {
          weekdayEl.textContent = date
            ? weekdayNames[getDateWeekday(date)]
            : "星期－";
        }
        if (scheduledCountEl)
          scheduledCountEl.textContent = "排班人員 " + scheduled + " 人";
        if (offdayCountEl)
          offdayCountEl.textContent = "休假人員 " + offday + " 人";
        if (totalCountEl)
          totalCountEl.textContent = "總人數 " + (scheduled + offday) + " 人";
      }

      function setHorizontalHeader(cellNo, text) {
        const cell = getCell(cellNo);
        if (!cell) return;

        const label = cell.querySelector(".fixed-label.horizontal");
        if (!label) return;

        label.replaceChildren();
        Array.from(text).forEach((ch) => {
          const span = document.createElement("span");
          span.textContent = ch;
          label.appendChild(span);
        });
      }

      function updateRotationHeaders(date) {
        const weekday = getDateWeekday(date);

        if (weekday === 6) {
          // 星期六：輪休假項下「例假日」改成「休息日」
          setHorizontalHeader(18, "休息日");
          setHorizontalHeader(19, "休息日");
        } else if (weekday === 0) {
          // 星期日：輪休假項下「休息日」改成「例假日」
          setHorizontalHeader(18, "例假日");
          setHorizontalHeader(19, "例假日");
        } else {
          // 平日恢復原本標題
          setHorizontalHeader(18, "休息日");
          setHorizontalHeader(19, "例假日");
        }
      }

      function getOffdayCellMapForDate(date) {
        const weekday = getDateWeekday(date);

        if (weekday === 6) {
          return {
            ...OFFDAY_CELL_MAP,
            例假日: [],
            休息日: WEEKEND_ROTATION_SLOTS,
          };
        }

        if (weekday === 0) {
          return {
            ...OFFDAY_CELL_MAP,
            例假日: WEEKEND_ROTATION_SLOTS,
            休息日: [],
          };
        }

        return OFFDAY_CELL_MAP;
      }

      function getOffdayNamesForType(day, leaveType, date) {
        const weekday = getDateWeekday(date);

        // 為避免 offday.json 仍以原假別欄位保存而漏人：
        // 星期六把「例假日 + 休息日」全部視為休息日；
        // 星期日把「例假日 + 休息日」全部視為例假日。
        if (weekday === 6 && leaveType === "休息日") {
          return [
            ...normalizeOffdayNames(day["休息日"]),
            ...normalizeOffdayNames(day["例假日"]),
          ];
        }

        if (weekday === 0 && leaveType === "例假日") {
          return [
            ...normalizeOffdayNames(day["例假日"]),
            ...normalizeOffdayNames(day["休息日"]),
          ];
        }

        return normalizeOffdayNames(day[leaveType]);
      }

      function renderOffdayForDate(date) {
        clearOffdayNames();
        updateRotationHeaders(date);

        const day = offdayData[date];
        if (!day) return 0;

        let rendered = 0;
        const effectiveMap = getOffdayCellMapForDate(date);

        for (const [leaveType, slots] of Object.entries(effectiveMap)) {
          if (!slots.length) continue;

          const names = getOffdayNamesForType(day, leaveType, date);

          names.slice(0, slots.length).forEach((name, index) => {
            addOffdayNameToCell(slots[index], name);
            rendered++;
          });
        }

        return rendered;
      }

      async function loadOffdayData() {
        try {
          const response = await fetch("./offday.json", { cache: "no-store" });

          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }

          const data = await response.json();

          if (!data || typeof data !== "object" || Array.isArray(data)) {
            throw new Error("offday.json 格式不正確");
          }

          offdayData = data;

          if (dateInput && dateInput.value) {
            renderSelectedDate();
          }
        } catch (err) {
          console.error("休假資料載入失敗：", err);
          if (dateInput && dateInput.value) renderSelectedDate();
        }
      }

      function renderSelectedDate() {
        clearScheduleNames();

        const date = dateInput.value;
        if (!date) {
          updateSummary("", 0, 0);
          return;
        }

        const day = scheduleData[date];

        if (!day) {
          const offdayRendered = renderOffdayForDate(date);
          updateSummary(date, 0, offdayRendered);
          return;
        }

        let rendered = 0;

        // 一般班別
        for (const [shift, target] of Object.entries(SHIFT_CELL_MAP)) {
          const name = normalizeName(day[shift]);
          if (name) {
            addNameToCell(target.cell, name);
            rendered++;
          }
        }

        // 支援：支援1~3有排人，就依順序塞進候選格。
        const supportNames = ["支援1", "支援2", "支援3"]
          .map((k) => normalizeName(day[k]))
          .filter(Boolean);

        // 見習：見習1~3同樣依順序塞進同一組候選格。
        const trainingNames = ["見習1", "見習2", "見習3"]
          .map((k) => normalizeName(day[k]))
          .filter(Boolean);

        const occupied = new Set();

        function fillSequential(names, slots) {
          for (const name of names) {
            const next = slots.find((cellNo) => !occupied.has(cellNo));
            if (!next) break;
            addNameToCell(next, name);
            occupied.add(next);
            rendered++;
          }
        }

        fillSequential(supportNames, SUPPORT_SLOTS);
        fillSequential(trainingNames, TRAINING_SLOTS);
        const offdayRendered = renderOffdayForDate(date);
        updateSummary(date, rendered, offdayRendered);
      }

      function configureDateRange() {
        const dates = Object.keys(scheduleData).sort();
        if (!dates.length) {
          updateSummary("", 0, 0);
          return;
        }

        dateInput.min = dates[0];
        dateInput.max = dates[dates.length - 1];

        const now = new Date();
        const today =
          now.getFullYear() +
          "-" +
          String(now.getMonth() + 1).padStart(2, "0") +
          "-" +
          String(now.getDate()).padStart(2, "0");

        dateInput.value = scheduleData[today] ? today : dates[dates.length - 1];
        renderSelectedDate();
      }

      async function loadScheduleData() {
        try {
          const response = await fetch("./schedule_data.json", {
            cache: "no-store",
          });
          if (!response.ok) {
            throw new Error("HTTP " + response.status);
          }
          const data = await response.json();
          if (!data || typeof data !== "object" || Array.isArray(data)) {
            throw new Error("JSON 格式不正確");
          }
          scheduleData = data;
          configureDateRange();
        } catch (err) {
          console.error("排班資料載入失敗：", err);
          updateSummary(dateInput ? dateInput.value : "", 0, 0);
        }
      }

      dateInput.addEventListener("change", renderSelectedDate);
      window.addEventListener("DOMContentLoaded", () => {
        loadScheduleData();
        loadOffdayData();
      });
    </script>

    <script>
      const viewport = document.getElementById("viewport");
      const sheet = document.getElementById("sheet");
      const BW = 1137,
        BH = 685;

      function fit() {
        const s =
          Math.min(viewport.clientWidth / BW, viewport.clientHeight / BH) * 0.9;
        sheet.style.transform = `translate(-50%,-50%) scale(${s})`;
      }
      new ResizeObserver(fit).observe(viewport);
      window.addEventListener("resize", fit);
      fit();
    </script>
  </body>
</html>
