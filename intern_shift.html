<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>臺南郵局運輸股｜見習排班編輯器</title>
    <style>
      :root {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        color: #17212c;
        background: #edf1f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .top {
        background: #16364a;
        color: white;
        padding: 17px 25px;
        display: flex;
        justify-content: space-between;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
      }
      .top h1 {
        font-size: 22px;
        margin: 0;
      }
      .top small {
        color: #c4d8e5;
      }
      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      button,
      .filelabel {
        border: 0;
        background: #fff;
        color: #193b4c;
        padding: 9px 13px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        font-size: 13px;
      }
      button.primary {
        background: #0e8c7c;
        color: #fff;
      }
      .shell {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 18px;
        padding: 18px;
        align-items: start;
      }
      .panel,
      .previewbox {
        background: white;
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 5px 25px #14263814;
      }
      .panel h2 {
        font-size: 16px;
        margin: 0 0 14px;
      }
      .field {
        margin: 0 0 12px;
      }
      .field label {
        display: block;
        font-size: 12px;
        color: #586878;
        margin-bottom: 5px;
      }
      .field input,
      .field select {
        width: 100%;
        border: 1px solid #d3dce3;
        border-radius: 7px;
        padding: 9px;
        font-size: 14px;
        background: white;
      }
      .twocol {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .hint {
        font-size: 12px;
        color: #647483;
        line-height: 1.6;
      }
      .people {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 220px;
        overflow: auto;
      }
      .person {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .person button {
        flex: 1;
        text-align: left;
        background: #f0f4f7;
      }
      .person.active button:first-child {
        background: #d6eee9;
        color: #086657;
      }
      .person .del {
        flex: 0;
        background: #fbe5e5;
        color: #a22;
      }
      .add {
        width: 100%;
        background: #e3f1ee;
        margin-top: 9px;
      }
      .previewbox {
        overflow: auto;
      }
      .previewhead {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }
      .previewhead h2 {
        margin: 0;
        font-size: 16px;
      }
      .previewhead span {
        font-size: 12px;
        color: #617487;
      }
      .sheet {
        background: #fff;
        width: 960px;
        min-height: 630px;
        margin: auto;
        padding: 47px 45px 30px;
        color: black;
        font-family: "Noto Serif TC", "PMingLiU", "Microsoft JhengHei", serif;
      }
      .sheet-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        border-bottom: 2px solid #888;
        padding: 0 10px 8px;
        gap: 12px;
      }
      .sheet-header .brand {
        font-size: 22px;
        line-height: 1.2;
        white-space: nowrap;
      }
      .sheet-header h1 {
        font-size: 46px;
        margin: 0;
        line-height: 1.2;
        white-space: nowrap;
        letter-spacing: 1px;
      }
      .sheet-header .detail {
        font-size: 19px;
        padding-bottom: 5px;
        text-align: right;
        white-space: nowrap;
      }
      .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 11px;
        margin-top: 20px;
      }
      .weekday {
        background: #f1f1f1;
        text-align: center;
        padding: 6px 0;
        border-radius: 7px;
        font-size: 18px;
        font-weight: 900;
      }
      .day {
        background: #f1f1f1;
        border-radius: 17px;
        height: 106px;
        position: relative;
        cursor: pointer;
        overflow: hidden;
      }
      .day.weekend {
        background: #fae3d7;
      }
      .day:hover {
        outline: 3px solid #6fc5af;
      }
      .month {
        position: absolute;
        top: 4px;
        left: 10px;
        font-size: 27px;
        color: #bcbcbc;
        font-weight: bold;
      }
      .weekend .month {
        color: #a50000;
      }
      .date {
        position: absolute;
        top: 17px;
        left: 32px;
        font-size: 42px;
        font-weight: 900;
        line-height: 1;
      }
      .shift {
        position: absolute;
        bottom: 9px;
        left: 12px;
        right: 12px;
        background: #626262;
        color: white;
        border-radius: 6px;
        text-align: center;
        font-weight: bold;
        font-size: 23px;
        line-height: 34px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .shift.checkin {
        background: #307d27;
      }
      .sheet-foot {
        font-size: 12px;
        color: #777;
        margin-top: 16px;
        text-align: right;
      }
      .editbox {
        position: fixed;
        inset: 0;
        background: #101b2d88;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9;
        padding: 16px;
      }
      .editbox.show {
        display: flex;
      }
      .dialog {
        background: #fff;
        border-radius: 14px;
        padding: 22px;
        width: min(370px, 100%);
        box-shadow: 0 12px 45px #0003;
      }
      .dialog h3 {
        margin-top: 0;
      }
      .dialog input {
        width: 100%;
        padding: 12px;
        font-size: 20px;
        border: 1px solid #cbd5dd;
        border-radius: 8px;
      }
      .quick {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .quick button {
        background: #e8f0f2;
      }
      .dialog .actions {
        justify-content: flex-end;
      }
      .dialog .actions button {
        background: #edf1f4;
      }
      .dialog .actions .primary {
        background: #0e8c7c;
        color: white;
      }
      @media (max-width: 950px) {
        .shell {
          grid-template-columns: 1fr;
        }
        .sheet {
          margin: 0;
        }
        .previewbox {
          overflow: auto;
        }
      }
      @media print {
        body {
          background: white;
        }
        .top,
        .panel,
        .previewhead,
        .sheet-foot,
        .editbox {
          display: none !important;
        }
        .shell {
          display: block;
          padding: 0;
        }
        .previewbox {
          padding: 0;
          box-shadow: none;
          overflow: visible;
        }
        .sheet {
          width: 100%;
          padding: 18mm 10mm;
          min-height: 0;
        }
        .days {
          gap: 8px;
        }
        .day {
          height: 95px;
        }
        .sheet-header .detail {
          font-size: 15px;
        }
        .sheet-header h1 {
          font-size: 37px;
        }
        .sheet-header .brand {
          font-size: 18px;
        }
        .weekday {
          font-size: 16px;
        }
        .date {
          font-size: 35px;
        }
        .shift {
          font-size: 19px;
          line-height: 30px;
        }
        @page {
          size: A4 landscape;
          margin: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <div>
        <h1>見習排班編輯器</h1>
        <small>臺南郵局運輸股 · 即時預覽與成果輸出</small>
      </div>
      <div class="actions">
        <button onclick="saveJSON()">匯出 JSON</button
        ><label class="filelabel"
          >匯入 JSON<input
            hidden
            type="file"
            accept=".json,application/json"
            onchange="loadJSON(event)" /></label
        ><button onclick="exportPNG()">匯出 PNG</button
        ><button onclick="exportPDF()">匯出 PDF</button
        ><button class="primary" onclick="window.print()">列印班表</button>
      </div>
    </header>
    <main class="shell">
      <aside class="panel">
        <h2>編輯設定</h2>
        <div class="field">
          <label>見習人員</label>
          <div id="people" class="people"></div>
          <button class="add" onclick="addPerson()">＋ 新增見習人員</button>
        </div>
        <div class="field">
          <label>姓名</label
          ><input id="name" oninput="updateField('name', this.value)" />
        </div>
        <div class="field">
          <label>見習班別</label
          ><select id="type" onchange="updateField('type', this.value)">
            <option>早班</option>
            <option>中班</option>
            <option>大夜班</option>
          </select>
        </div>
        <div class="twocol">
          <div class="field">
            <label>見習起日</label
            ><input
              type="date"
              id="periodStart"
              onchange="updateField('periodStart', this.value)"
            />
          </div>
          <div class="field">
            <label>見習迄日</label
            ><input
              type="date"
              id="periodEnd"
              onchange="updateField('periodEnd', this.value)"
            />
          </div>
        </div>
        <div class="twocol">
          <div class="field">
            <label>班表顯示起日</label
            ><input
              type="date"
              id="viewStart"
              onchange="updateField('viewStart', this.value)"
            />
          </div>
          <div class="field">
            <label>班表顯示迄日</label
            ><input
              type="date"
              id="viewEnd"
              onchange="updateField('viewEnd', this.value)"
            />
          </div>
        </div>
        <div class="field">
          <label>日期排列方式</label
          ><select
            id="weekStart"
            onchange="updateField('weekStart', +this.value)"
          >
            <option value="1">星期一開始</option>
            <option value="4">星期四開始</option>
            <option value="0">星期日開始</option>
          </select>
        </div>
        <p class="hint">
          點擊右側任一日期即可編輯班別。空白代表未排班；「報到」自動顯示綠色。資料會自動保存在目前瀏覽器，建議定期匯出
          JSON 備份。
        </p>
        <button onclick="copyPerson()" style="width: 100%; background: #e9edf2">
          複製目前人員班表
        </button>
      </aside>
      <section class="previewbox">
        <div class="previewhead">
          <h2>班表即時預覽</h2>
          <span>點擊日期格直接編輯 · A4 橫式</span>
        </div>
        <div id="sheet" class="sheet"></div>
      </section>
    </main>
    <div
      class="editbox"
      id="modal"
      onclick="if (event.target === this) closeModal();"
    >
      <div class="dialog">
        <h3 id="editTitle">編輯班別</h3>
        <input
          id="shiftInput"
          placeholder="例如：中7、夜1、772、報到"
          onkeydown="if (event.key === 'Enter') commitShift();"
        />
        <div class="quick" id="quick"></div>
        <div class="actions">
          <button onclick="document.getElementById('shiftInput').value = ''">
            清空</button
          ><button onclick="closeModal()">取消</button
          ><button class="primary" onclick="commitShift()">儲存</button>
        </div>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id),
        KEY = "tainan-trainee-roster-v1";
      const make = (name, type, start, end, viewStart, viewEnd, shifts) => ({
        id: Date.now() + Math.random(),
        name,
        type,
        periodStart: start,
        periodEnd: end,
        viewStart,
        viewEnd,
        weekStart: new Date(viewStart + "T12:00:00").getDay(),
        shifts,
      });
      let people = [
        make(
          "陳柏至",
          "大夜班",
          "2026-10-02",
          "2026-10-12",
          "2026-10-01",
          "2026-10-23",
          {
            "2026-10-01": "報到",
            "2026-10-02": "128",
            "2026-10-03": "夜1",
            "2026-10-05": "夜1",
            "2026-10-06": "夜1",
            "2026-10-07": "夜3",
            "2026-10-08": "夜3",
            "2026-10-12": "中9",
          },
        ),
        make(
          "黃正宇",
          "中班",
          "2026-10-13",
          "2026-11-03",
          "2026-10-12",
          "2026-11-03",
          {
            "2026-10-12": "報到",
            "2026-10-13": "772",
            "2026-10-14": "中7",
            "2026-10-15": "中7",
            "2026-10-16": "中8",
            "2026-10-17": "772",
            "2026-10-20": "中2",
            "2026-10-21": "中2",
            "2026-10-22": "中5",
            "2026-10-23": "中5",
            "2026-10-27": "夜3",
            "2026-10-28": "夜3",
            "2026-10-29": "夜1",
            "2026-10-30": "夜1",
            "2026-10-31": "夜1",
            "2026-11-03": "中4",
          },
        ),
        make(
          "李承易",
          "中班",
          "2026-10-13",
          "2026-11-03",
          "2026-10-12",
          "2026-11-03",
          {
            "2026-10-12": "報到",
            "2026-10-13": "中2",
            "2026-10-14": "中2",
            "2026-10-15": "中4",
            "2026-10-18": "772",
            "2026-10-19": "772",
            "2026-10-20": "中5",
            "2026-10-21": "中5",
            "2026-10-22": "中7",
            "2026-10-23": "中7",
            "2026-10-27": "夜1",
            "2026-10-28": "夜1",
            "2026-10-29": "夜3",
            "2026-10-30": "夜3",
            "2026-11-02": "中8",
            "2026-11-03": "中8",
          },
        ),
        make(
          "葉建彰",
          "早班",
          "2026-10-13",
          "2026-11-03",
          "2026-10-12",
          "2026-11-03",
          {
            "2026-10-12": "報到",
            "2026-10-13": "早1",
            "2026-10-14": "新營2",
            "2026-10-15": "中9",
            "2026-10-17": "乙線",
            "2026-10-18": "早1",
            "2026-10-19": "早3",
            "2026-10-20": "早3",
            "2026-10-21": "早3",
            "2026-10-22": "新營1",
            "2026-10-26": "早3",
            "2026-10-27": "早2",
            "2026-10-28": "早2",
            "2026-10-29": "早4",
            "2026-10-30": "早4",
            "2026-10-31": "甲線",
          },
        ),
        make(
          "岩研",
          "大夜班",
          "2026-10-13",
          "2026-11-03",
          "2026-10-12",
          "2026-11-03",
          {
            "2026-10-12": "報到",
            "2026-10-13": "夜1",
            "2026-10-14": "夜1",
            "2026-10-15": "夜1",
            "2026-10-16": "夜1",
            "2026-10-17": "夜1",
            "2026-10-20": "夜3",
            "2026-10-21": "夜3",
            "2026-10-22": "夜3",
            "2026-10-23": "夜3",
            "2026-10-27": "協運",
            "2026-10-28": "中8",
            "2026-10-29": "128",
            "2026-10-30": "128",
            "2026-10-31": "夜2",
            "2026-11-03": "夜2",
          },
        ),
      ];
      try {
        let s = JSON.parse(localStorage.getItem(KEY));
        if (Array.isArray(s) && s.length) people = s;
      } catch (e) {}
      let selected = 0,
        editing = null;
      const active = () => people[selected],
        persist = () => {
          try {
            localStorage.setItem(KEY, JSON.stringify(people));
          } catch (e) {}
        };
      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function fmt(d) {
        let [y, m, day] = d.split("-").map(Number);
        return `${y - 1911}/${m}/${day}`;
      }
      function iso(d) {
        let y = d.getFullYear(),
          m = String(d.getMonth() + 1).padStart(2, "0"),
          day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }
      function date(s) {
        return new Date(s + "T12:00:00");
      }
      function render() {
        if (!people.length) return;
        let p = active();
        $("people").innerHTML = people
          .map(
            (v, i) =>
              `<div class="person ${i === selected ? "active" : ""}"><button onclick="selectPerson(${i})">${esc(v.name)} · ${esc(v.type)}</button><button class="del" onclick="removePerson(${i})">×</button></div>`,
          )
          .join("");
        for (let k of [
          "name",
          "type",
          "periodStart",
          "periodEnd",
          "viewStart",
          "viewEnd",
          "weekStart",
        ])
          $(k).value = p[k];
        let s = date(p.viewStart),
          e = date(p.viewEnd);
        if (e < s) {
          $("sheet").innerHTML = "<p>顯示迄日不得早於起日</p>";
          return;
        }
        let days = Math.min(120, Math.round((e - s) / 86400000) + 1);
        let offset = (s.getDay() - Number(p.weekStart) + 7) % 7;
        let weekdays = [
          "星期日",
          "星期一",
          "星期二",
          "星期三",
          "星期四",
          "星期五",
          "星期六",
        ];
        let cells = "";
        for (let i = 0; i < offset; i++) cells += "<div></div>";
        for (let i = 0; i < days; i++) {
          let d = new Date(s);
          d.setDate(s.getDate() + i);
          let key = iso(d),
            shift = p.shifts[key] || "",
            weekend = [0, 6].includes(d.getDay());
          cells += `<div class="day ${weekend ? "weekend" : ""}" onclick="editShift('${key}')" title="${esc(key)}：${esc(shift || "未排班")}"><span class="month">${d.getMonth() + 1}</span><span class="date">${d.getDate()}</span>${shift ? `<span class="shift ${shift === "報到" ? "checkin" : ""}">${esc(shift)}</span>` : ""}</div>`;
        }
        let heads = "";
        for (let i = 0; i < 7; i++)
          heads += `<div class="weekday">${weekdays[(Number(p.weekStart) + i) % 7]}</div>`;
        $("sheet").innerHTML =
          `<div class="sheet-header"><div><div class="brand">臺南郵局運輸股</div><h1>見習排班表</h1></div><div class="detail">見習期間：${fmt(p.periodStart)}-${fmt(p.periodEnd)}　<strong>${esc(p.type)}</strong> 見習人員：${esc(p.name)}</div></div><div class="days">${heads}${cells}</div><div class="sheet-foot">點擊日期可編輯｜空白表示未排班</div>`;
        persist();
      }
      function selectPerson(i) {
        selected = i;
        render();
      }
      function updateField(k, v) {
        active()[k] = v;
        render();
      }
      function addPerson() {
        let p = make(
          "新進人員",
          "早班",
          "2026-10-13",
          "2026-11-03",
          "2026-10-12",
          "2026-11-03",
          {},
        );
        people.push(p);
        selected = people.length - 1;
        render();
        $("name").focus();
        $("name").select();
      }
      function copyPerson() {
        let p = JSON.parse(JSON.stringify(active()));
        p.id = Date.now();
        p.name += "（複製）";
        people.push(p);
        selected = people.length - 1;
        render();
      }
      function removePerson(i) {
        if (people.length === 1) {
          alert("至少保留一位人員");
          return;
        }
        if (!confirm(`確定刪除 ${people[i].name}？`)) return;
        people.splice(i, 1);
        selected = Math.min(selected, people.length - 1);
        render();
      }
      function editShift(key) {
        editing = key;
        $("editTitle").textContent =
          `${fmt(key)}　${["日", "一", "二", "三", "四", "五", "六"][date(key).getDay()]}`;
        $("shiftInput").value = active().shifts[key] || "";
        $("quick").innerHTML = [
          "報到",
          "早1",
          "早2",
          "早3",
          "早4",
          "新營1",
          "新營2",
          "甲線",
          "乙線",
          "772",
          "中2",
          "中3",
          "中4",
          "中5",
          "中7",
          "中8",
          "協運",
          "夜1",
          "夜2",
          "夜3",
          "128",
        ]
          .map(
            (v) =>
              `<button onclick="$('shiftInput').value='${v}'">${v}</button>`,
          )
          .join("");
        $("modal").classList.add("show");
        $("shiftInput").focus();
        $("shiftInput").select();
      }
      function closeModal() {
        $("modal").classList.remove("show");
      }
      function commitShift() {
        let v = $("shiftInput").value.trim();
        if (v) active().shifts[editing] = v;
        else delete active().shifts[editing];
        closeModal();
        render();
      }
      function download(blob, name) {
        let a = document.createElement("a"),
          u = URL.createObjectURL(blob);
        a.href = u;
        a.download = name;
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(u), 2000);
      }
      function saveJSON() {
        download(
          new Blob([JSON.stringify({ version: 1, people }, null, 2)], {
            type: "application/json",
          }),
          "intern_shift_data.json",
        );
      }
      async function loadJSON(e) {
        let f = e.target.files[0];
        if (!f) return;
        try {
          let obj = JSON.parse(await f.text()),
            a = Array.isArray(obj) ? obj : obj.people;
          if (
            !Array.isArray(a) ||
            !a.length ||
            !a.every((x) => x.name && x.viewStart && x.viewEnd && x.shifts)
          )
            throw Error("格式不正確");
          people = a;
          selected = 0;
          render();
          alert("資料匯入成功");
        } catch (err) {
          alert("匯入失敗：" + err.message);
        }
        e.target.value = "";
      }
      async function capture() {
        let node = $("sheet");
        let xml = new XMLSerializer().serializeToString(node);
        /* html2canvas is loaded on demand for image export */ if (
          typeof html2canvas === "undefined"
        ) {
          await new Promise((resolve, reject) => {
            let sc = document.createElement("script");
            sc.src =
              "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
            sc.onload = resolve;
            sc.onerror = reject;
            document.head.append(sc);
          });
        }
        return html2canvas(node, {
          scale: 2,
          backgroundColor: "#ffffff",
          width: 960,
          windowWidth: 1100,
          scrollX: 0,
          scrollY: 0,
        });
      }
      async function exportPNG() {
        try {
          let c = await capture();
          c.toBlob(
            (b) => download(b, `見習班表_${active().name}.png`),
            "image/png",
          );
        } catch (e) {
          alert(
            "圖片匯出需要網路載入元件；若無法連線，可先使用列印功能另存 PDF。",
          );
        }
      }
      async function exportPDF() {
        try {
          let c = await capture();
          if (!window.jspdf) {
            await new Promise((resolve, reject) => {
              let sc = document.createElement("script");
              sc.src =
                "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
              sc.onload = resolve;
              sc.onerror = reject;
              document.head.append(sc);
            });
          }
          let { jsPDF } = window.jspdf,
            pdf = new jsPDF({
              orientation: "landscape",
              unit: "mm",
              format: "a4",
            });
          let w = 277,
            h = (c.height * w) / c.width;
          if (h > 190) {
            h = 190;
            w = (c.width * h) / c.height;
          }
          pdf.addImage(
            c.toDataURL("image/png"),
            "PNG",
            (297 - w) / 2,
            Math.max(5, (210 - h) / 2),
            w,
            h,
          );
          pdf.save(`見習班表_${active().name}.pdf`);
        } catch (e) {
          alert(
            "PDF 匯出需要網路載入元件；可改用「列印班表」→「另存為 PDF」。",
          );
        }
      }
      render();
    </script>
  </body>
</html>
