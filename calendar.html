<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Cache-Control"
      content="no-store, no-cache, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>班表-月行事曆</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #09111f;
        --panel: rgba(17, 27, 45, 0.78);
        --panel-border: rgba(255, 255, 255, 0.08);
        --card: rgba(255, 255, 255, 0.05);
        --text: #ecf3ff;
        --sub: #94a3b8;
        --primary: #4ade80;
        --primary-soft: rgba(74, 222, 128, 0.18);
        --danger: #fb7185;
        --holiday: #ffb4c1;
        --today: #38bdf8;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Noto Sans TC", sans-serif;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at top left,
            rgba(56, 189, 248, 0.16),
            transparent 25%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(74, 222, 128, 0.14),
            transparent 28%
          ),
          linear-gradient(135deg, #071019 0%, #101a2f 55%, #0a1220 100%);
        color: var(--text);
        padding: 18px;
        overflow-x: hidden;
      }

      .app {
        max-width: 1600px;
        margin: auto;
      }

      .hero {
        position: relative;
        overflow: hidden;
        border-radius: 28px;
        padding: 28px;
        margin-bottom: 22px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.03)
        );
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: var(--shadow);
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          120deg,
          transparent,
          rgba(255, 255, 255, 0.06),
          transparent
        );
        transform: translateX(-100%);
        animation: shine 10s linear infinite;
      }

      @keyframes shine {
        to {
          transform: translateX(100%);
        }
      }

      .hero-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
        position: relative;
        z-index: 1;
      }

      .title-area h1 {
        font-size: clamp(2rem, 4vw, 3.8rem);
        font-weight: 900;
        letter-spacing: 2px;
        line-height: 1.1;
      }

      .title-area p {
        color: var(--sub);
        margin-top: 10px;
        font-size: 1rem;
      }

      .clock-box {
        padding: 16px 22px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        text-align: center;
        min-width: 220px;
      }

      .clock-box .time {
        font-size: 2rem;
        font-weight: 900;
        color: var(--primary);
      }

      .controls {
        margin-top: 24px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 14px;
        position: relative;
        z-index: 1;
      }

      .control-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 22px;
        padding: 16px;
        backdrop-filter: blur(14px);
      }

      .control-card label {
        display: block;
        margin-bottom: 10px;
        font-size: 0.9rem;
        color: var(--sub);
        font-weight: 700;
      }

      select,
      button {
        width: 100%;
        border: none;
        border-radius: 16px;
        padding: 14px;
        font-size: 1rem;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.08);
        color: white;
        outline: none;
        transition: 0.25s;
        appearance: none;
        -webkit-appearance: none;
        cursor: pointer;
      }

      select {
        background-image:
          linear-gradient(45deg, transparent 50%, #e8f4ff 50%),
          linear-gradient(135deg, #e8f4ff 50%, transparent 50%);
        background-position:
          calc(100% - 22px) 50%,
          calc(100% - 16px) 50%;
        background-size:
          6px 6px,
          6px 6px;
        background-repeat: no-repeat;
        padding-right: 44px;
      }

      select option {
        background: #1f2937;
        color: #f8fafc;
        font-weight: 700;
      }

      select:focus {
        background-color: rgba(255, 255, 255, 0.14);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
      }

      select:hover,
      button:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.14);
      }

      button {
        background: linear-gradient(135deg, #22c55e, #06b6d4);
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(34, 197, 94, 0.25);
      }

      .calendar-shell {
        background: rgba(9, 15, 28, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 30px;
        padding: 18px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .week-header {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 12px;
        margin-bottom: 14px;
      }

      .week-header div {
        text-align: center;
        padding: 16px 10px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.06);
        font-weight: 900;
        letter-spacing: 1px;
      }

      .week-header .weekend {
        color: var(--holiday);
        background: rgba(251, 113, 133, 0.12);
      }

      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 12px;
      }

      .day-card {
        min-height: 180px;
        border-radius: 24px;
        padding: 14px;
        position: relative;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.08),
          rgba(255, 255, 255, 0.03)
        );
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: 0.3s ease;
        display: flex;
        flex-direction: column;
      }

      .day-card:hover {
        transform: translateY(-4px) scale(1.01);
        border-color: rgba(74, 222, 128, 0.45);
        box-shadow: 0 14px 35px rgba(0, 0, 0, 0.3);
      }

      .day-card.today {
        border: 2px solid var(--today);
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
      }

      .day-card.holiday {
        background: linear-gradient(
          180deg,
          rgba(251, 113, 133, 0.12),
          rgba(255, 255, 255, 0.03)
        );
      }

      .day-card.other {
        opacity: 0.25;
        filter: grayscale(0.4);
      }

      .date-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .date-number {
        font-size: clamp(1.4rem, 2vw, 2rem);
        font-weight: 900;
      }

      .holiday-tag {
        background: rgba(251, 113, 133, 0.2);
        color: #ffd9e1;
        font-size: 0.72rem;
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 700;
        border: 1px solid rgba(251, 113, 133, 0.3);
      }

      .shift-area {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* ===== 班別標籤：漸層水晶按鈕 ===== */
      .shift-tag {
        --shift-bg-1: rgba(34, 197, 94, 0.86);
        --shift-bg-2: rgba(6, 182, 212, 0.76);
        --shift-border: rgba(134, 239, 172, 0.62);
        --shift-accent: #86efac;
        --shift-glow: rgba(74, 222, 128, 0.24);
        position: relative;
        isolation: isolate;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 9px;
        min-height: 43px;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.18) 0%,
            rgba(255, 255, 255, 0.04) 42%,
            rgba(0, 0, 0, 0.12) 100%
          ),
          linear-gradient(118deg, var(--shift-bg-1) 0%, var(--shift-bg-2) 100%);
        border: 1px solid var(--shift-border);
        color: #fff;
        padding: 9px 13px;
        border-radius: 16px;
        font-weight: 900;
        text-align: left;
        letter-spacing: 0.55px;
        backdrop-filter: blur(12px) saturate(135%);
        -webkit-backdrop-filter: blur(12px) saturate(135%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.38),
          inset 0 -1px 0 rgba(0, 0, 0, 0.18),
          0 7px 18px rgba(0, 0, 0, 0.22),
          0 0 18px var(--shift-glow);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
        transition:
          transform 0.2s ease,
          filter 0.2s ease,
          box-shadow 0.2s ease;
      }

      .shift-tag::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 1px 2px auto 2px;
        height: 48%;
        border-radius: 14px 14px 46% 46%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.32),
          rgba(255, 255, 255, 0.04)
        );
        opacity: 0.72;
        pointer-events: none;
      }

      .shift-tag::after {
        content: "";
        position: absolute;
        z-index: -1;
        width: 44%;
        height: 170%;
        top: -50%;
        left: -34%;
        transform: rotate(24deg);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.18),
          transparent
        );
        opacity: 0.55;
        pointer-events: none;
      }

      .shift-tag:hover {
        transform: translateY(-1px);
        filter: saturate(1.08) brightness(1.05);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.46),
          inset 0 -1px 0 rgba(0, 0, 0, 0.16),
          0 9px 22px rgba(0, 0, 0, 0.26),
          0 0 24px var(--shift-glow);
      }

      .shift-icon {
        width: 27px;
        height: 27px;
        flex: 0 0 27px;
        display: inline-grid;
        place-items: center;
        border-radius: 9px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.24),
          rgba(255, 255, 255, 0.08)
        );
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-size: 14px;
        line-height: 1;
      }

      .shift-name {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .shift-tag.shift-early {
        --shift-bg-1: rgba(250, 204, 21, 0.9);
        --shift-bg-2: rgba(249, 115, 22, 0.82);
        --shift-border: rgba(253, 224, 71, 0.72);
        --shift-accent: #fde047;
        --shift-glow: rgba(250, 204, 21, 0.28);
      }

      .shift-tag.shift-day {
        --shift-bg-1: rgba(34, 197, 94, 0.86);
        --shift-bg-2: rgba(45, 212, 191, 0.76);
        --shift-border: rgba(74, 222, 128, 0.68);
        --shift-accent: #86efac;
        --shift-glow: rgba(34, 197, 94, 0.25);
      }

      .shift-tag.shift-mid {
        --shift-bg-1: rgba(6, 182, 212, 0.9);
        --shift-bg-2: rgba(59, 130, 246, 0.82);
        --shift-border: rgba(103, 232, 249, 0.7);
        --shift-accent: #67e8f9;
        --shift-glow: rgba(56, 189, 248, 0.28);
      }

      .shift-tag.shift-night {
        --shift-bg-1: rgba(79, 70, 229, 0.9);
        --shift-bg-2: rgba(147, 51, 234, 0.82);
        --shift-border: rgba(196, 181, 253, 0.68);
        --shift-accent: #c4b5fd;
        --shift-glow: rgba(139, 92, 246, 0.29);
      }

      .shift-tag.shift-special {
        --shift-bg-1: rgba(236, 72, 153, 0.9);
        --shift-bg-2: rgba(168, 85, 247, 0.8);
        --shift-border: rgba(249, 168, 212, 0.7);
        --shift-accent: #f9a8d4;
        --shift-glow: rgba(236, 72, 153, 0.27);
      }

      .shift-tag.shift-field {
        --shift-bg-1: rgba(249, 115, 22, 0.9);
        --shift-bg-2: rgba(239, 68, 68, 0.78);
        --shift-border: rgba(253, 186, 116, 0.7);
        --shift-accent: #fdba74;
        --shift-glow: rgba(249, 115, 22, 0.27);
      }

      .shift-tag.shift-office {
        --shift-bg-1: rgba(13, 148, 136, 0.9);
        --shift-bg-2: rgba(6, 182, 212, 0.8);
        --shift-border: rgba(94, 234, 212, 0.68);
        --shift-accent: #5eead4;
        --shift-glow: rgba(45, 212, 191, 0.25);
      }

      .shift-tag.shift-lead {
        --shift-bg-1: rgba(245, 158, 11, 0.92);
        --shift-bg-2: rgba(239, 68, 68, 0.78);
        --shift-border: rgba(253, 230, 138, 0.72);
        --shift-accent: #fde68a;
        --shift-glow: rgba(245, 158, 11, 0.29);
      }

      .shift-tag.shift-default {
        --shift-bg-1: rgba(71, 85, 105, 0.9);
        --shift-bg-2: rgba(30, 41, 59, 0.86);
        --shift-border: rgba(203, 213, 225, 0.48);
        --shift-accent: #e2e8f0;
        --shift-glow: rgba(148, 163, 184, 0.18);
      }

      /* ===== 日期資訊：國曆 / 農曆 / 節氣 ===== */
      .date-row {
        gap: 8px;
        min-width: 0;
      }

      .date-meta {
        margin-left: auto;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        min-width: 0;
        flex-wrap: wrap;
      }

      .lunar-date {
        color: rgba(226, 232, 240, 0.72);
        font-size: 0.73rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .solar-term {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 3px 7px;
        border-radius: 999px;
        color: #bbf7d0;
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid rgba(74, 222, 128, 0.2);
        font-size: 0.68rem;
        font-weight: 900;
        letter-spacing: 0.06em;
        white-space: nowrap;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      }

      /* 國定假日改用較具書法感的字體，讓假日名稱和一般標籤明顯區隔 */
      .holiday-tag {
        font-family: "Noto Serif TC", "BiauKai", "DFKai-SB", serif;
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        color: #ffd5dc;
        background: linear-gradient(
          135deg,
          rgba(244, 63, 94, 0.22),
          rgba(190, 24, 93, 0.12)
        );
        border: 1px solid rgba(251, 113, 133, 0.38);
        box-shadow:
          0 5px 16px rgba(190, 24, 93, 0.12),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        text-shadow: 0 0 12px rgba(251, 113, 133, 0.2);
      }

      .day-card.holiday .date-number {
        color: #ff9bab;
        text-shadow: 0 0 18px rgba(251, 113, 133, 0.18);
      }

      /* ===== 今日好運提醒 ===== */
      .fortune-button {
        margin-top: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 0.88rem;
        background: linear-gradient(
          135deg,
          rgba(168, 85, 247, 0.28),
          rgba(251, 146, 60, 0.26)
        );
        border: 1px solid rgba(253, 186, 116, 0.35);
        box-shadow: 0 8px 22px rgba(124, 58, 237, 0.14);
      }

      .fortune-button:hover {
        background: linear-gradient(
          135deg,
          rgba(168, 85, 247, 0.38),
          rgba(251, 146, 60, 0.34)
        );
        box-shadow: 0 10px 26px rgba(124, 58, 237, 0.22);
      }

      .fortune-modal {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        place-items: center;
        padding: 18px;
        background: rgba(2, 6, 23, 0.72);
        backdrop-filter: blur(12px);
      }

      .fortune-modal.show {
        display: grid;
      }

      .fortune-dialog {
        position: relative;
        width: min(520px, 100%);
        border-radius: 26px;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(168, 85, 247, 0.22),
            transparent 32%
          ),
          radial-gradient(
            circle at 90% 90%,
            rgba(251, 146, 60, 0.18),
            transparent 32%
          ),
          linear-gradient(145deg, rgba(18, 28, 48, 0.98), rgba(8, 15, 29, 0.98));
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.55),
          0 0 50px rgba(168, 85, 247, 0.1);
      }

      .fortune-dialog::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(
          115deg,
          transparent 15%,
          rgba(255, 255, 255, 0.045) 50%,
          transparent 85%
        );
      }

      .fortune-head {
        position: relative;
        padding: 24px 56px 16px 24px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .fortune-kicker {
        color: #c4b5fd;
        font-size: 0.74rem;
        font-weight: 900;
        letter-spacing: 0.18em;
      }

      .fortune-title {
        margin-top: 5px;
        font-size: 1.45rem;
        font-weight: 900;
      }

      .fortune-close {
        position: absolute;
        top: 17px;
        right: 17px;
        width: 36px;
        height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: none;
        font-size: 1.1rem;
      }

      .fortune-body {
        position: relative;
        padding: 24px;
      }

      .fortune-date {
        color: #94a3b8;
        font-size: 0.82rem;
        font-weight: 700;
        margin-bottom: 14px;
      }

      .fortune-theme {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 11px;
        margin-bottom: 14px;
        border-radius: 999px;
        color: #fde68a;
        background: rgba(245, 158, 11, 0.1);
        border: 1px solid rgba(245, 158, 11, 0.22);
        font-size: 0.8rem;
        font-weight: 900;
      }

      .fortune-content {
        color: #e2e8f0;
        font-size: 1rem;
        line-height: 1.9;
        white-space: pre-line;
      }

      .fortune-note {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px dashed rgba(255, 255, 255, 0.1);
        color: #64748b;
        font-size: 0.76rem;
        line-height: 1.7;
      }

      @media (max-width: 1280px) {
        .lunar-date {
          font-size: 0.68rem;
        }
        .solar-term {
          font-size: 0.64rem;
          padding-inline: 6px;
        }
      }

      @media (max-width: 768px) {
        .date-row {
          align-items: flex-start;
        }
        .date-meta {
          gap: 4px;
        }
        .lunar-date {
          font-size: 0.66rem;
        }
        .solar-term {
          min-height: 20px;
          font-size: 0.61rem;
        }
      }

      .empty-text {
        margin-top: auto;
        flex: 1;
        min-height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.92);
        font-family: "Noto Serif TC", "Noto Sans TC", serif;
        font-size: clamp(3.8rem, 5.2vw, 6.2rem);
        font-weight: 900;
        line-height: 1;
        letter-spacing: 0.08em;
        text-align: center;
        padding: 6px 0 14px;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.28);
        user-select: none;
      }

      /* ===== 尚未排班：維持日期卡尺寸，不讓內容把方框撐高 ===== */
      .not-scheduled-state {
        margin-top: auto;
        flex: 1 1 0;
        min-height: 0;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 2px 4px 8px;
        overflow: hidden;
        text-align: center;
        user-select: none;
      }

      .not-scheduled-icon {
        width: clamp(36px, 3.2vw, 48px);
        height: clamp(36px, 3.2vw, 48px);
        flex: 0 0 auto;
        filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.2));
      }

      .not-scheduled-icon svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .not-scheduled-title {
        font-family: "Noto Serif TC", "Noto Sans TC", serif;
        font-size: clamp(1rem, 1.25vw, 1.35rem);
        font-weight: 900;
        line-height: 1.12;
        letter-spacing: 0.08em;
        white-space: nowrap;
        background: linear-gradient(
          90deg,
          #c084fc 0%,
          #a78bfa 38%,
          #67e8f9 100%
        );
        -webkit-background-clip: text;

    <script>
      let scheduleData = {};
      let fortuneData = {};
      let taskData = [];
      // ============================================================
      // 國定假日設定區｜每年只要在這裡直接增修即可
      // 格式："YYYY-MM-DD": "假日名稱",
      // 例如："2026-09-28": "教師節",
      // 若政府公告新增補假，只要照相同格式加一行即可。
      // ============================================================
      const holidays = {
        "2026-01-01": "元旦",
        "2026-02-16": "春節(除夕)",
        "2026-02-17": "春節(大年初一)",
        "2026-02-18": "春節(大年初二)",

        "2026-04-03": "補假1日",
        "2026-04-04": "兒童節",
        "2026-04-05": "清明節",
        "2026-04-06": "補假1日",
        "2026-05-01": "勞動節",

      };

      const yearSelect = document.getElementById("yearSelect");
      const monthSelect = document.getElementById("monthSelect");
      const staffSelect = document.getElementById("staffSelect");
      const calendarGrid = document.getElementById("calendarGrid");

      const now = new Date();

      // 二十四節氣：以 1900 年基準分鐘數估算，適用一般月曆顯示。
      const solarTermNames = [
        "小寒",
        "大寒",
        "立春",
        "雨水",
        "驚蟄",
        "春分",
        "清明",
        "穀雨",
        "立夏",
        "小滿",
        "芒種",
        "夏至",
        "小暑",
        "大暑",
        "立秋",
        "處暑",
        "白露",
        "秋分",
        "寒露",
        "霜降",
        "立冬",
        "小雪",
        "大雪",
        "冬至",
      ];

      const solarTermMinutes = [
        0, 21208, 42467, 63836, 85337, 107014, 128867, 150921, 173149, 195551,
        218072, 240693, 263343, 285989, 308563, 331033, 353350, 375494, 397447,
        419210, 440795, 462224, 483532, 504758,
      ];

      function getSolarTerm(year, month, day) {
        const terms = [];
        for (let i = month * 2; i <= month * 2 + 1; i++) {
          const utc =
            31556925974.7 * (year - 1900) +
            solarTermMinutes[i] * 60000 +
            Date.UTC(1900, 0, 6, 2, 5);
          const termDate = new Date(utc);
          // 轉成臺灣時區日期，避免跨日顯示。
          const tw = new Date(termDate.getTime() + 8 * 60 * 60 * 1000);
          if (tw.getUTCDate() === day) terms.push(solarTermNames[i]);
        }
        return terms.join("・");
      }

      function lunarNumberToChinese(num) {
        const n = Number(num);
        const digits = [
          "零",
          "一",
          "二",
          "三",
          "四",
          "五",
          "六",
          "七",
          "八",
          "九",
        ];
        if (!Number.isFinite(n) || n < 0) return String(num);
        if (n < 10) return digits[n];
        if (n === 10) return "十";
        if (n < 20) return "十" + digits[n - 10];
        if (n < 30) return "二十" + (n === 20 ? "" : digits[n - 20]);
        if (n < 40) return "三十" + (n === 30 ? "" : digits[n - 30]);
        return String(num);
      }

      function getLunarDate(dateObj) {
        try {
          const formatter = new Intl.DateTimeFormat("zh-TW-u-ca-chinese", {
            month: "long",
            day: "numeric",
          });
          let lunar = formatter.format(dateObj).replace(/\s+/g, "");

          // 將農曆日期中的阿拉伯數字全部轉成中文數字，例如：八月1 → 八月一日。
          lunar = lunar.replace(
            /(\d+)月(\d+)日?/,
            (_, month, day) =>
              `${lunarNumberToChinese(month)}月${lunarNumberToChinese(day)}日`,
          );

          // 部分瀏覽器月份已是中文，只會輸出日期數字，例如：八月1。
          lunar = lunar.replace(
            /月(\d+)日?/,
            (_, day) => `月${lunarNumberToChinese(day)}日`,
          );

          if (!lunar.endsWith("日")) lunar += "日";
          return lunar;
        } catch (err) {
          return "";
        }
      }

      function getFortuneKey(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, "0");
        const d = String(dateObj.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function findFortuneForDate(dateObj) {
        const fullKey = getFortuneKey(dateObj);
        const recurringKey = fullKey.slice(5); // MM-DD，可每年沿用
        return (
          fortuneData[fullKey] ||
          fortuneData[recurringKey] ||
          fortuneData._default ||
          null
        );
      }

      function openFortune() {
        const modal = document.getElementById("fortuneModal");
        const dateEl = document.getElementById("fortuneDate");
        const themeEl = document.getElementById("fortuneTheme");
        const contentEl = document.getElementById("fortuneContent");
        const today = new Date();
        const fortune = findFortuneForDate(today);

        dateEl.textContent = today.toLocaleDateString("zh-TW", {
          year: "numeric",
          month: "long",
          day: "numeric",
          weekday: "long",
        });

        if (fortune) {
          themeEl.textContent = `✦ ${fortune.theme || "今日主題"}`;
          contentEl.textContent =
            fortune.content || fortune.tip || "尚未設定今日內容。";
        } else {
          themeEl.textContent = "✦ 今日主題";
          contentEl.textContent =
            "今天的好運小方法尚未設定。請在 fortune_data.json 中新增今天的資料。";
        }

        modal.classList.add("show");
        document.body.style.overflow = "hidden";
      }

      function closeFortune() {
        document.getElementById("fortuneModal").classList.remove("show");
        document.body.style.overflow = "";
      }

      async function init() {
        for (let y = 2025; y <= 2028; y++) {
          yearSelect.options.add(new Option(`${y} 年`, y));
        }

        for (let m = 0; m < 12; m++) {
          monthSelect.options.add(new Option(`${m + 1} 月`, m));
        }

        yearSelect.value = now.getFullYear();
        monthSelect.value = now.getMonth();

        try {
          const response = await fetch("schedule_data.json?t=" + Date.now(), {
            cache: "no-store",
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          scheduleData = await response.json();
          populateStaff(scheduleData);
        } catch (err) {
          console.warn("schedule_data.json 讀取失敗", err);
        }

        try {
          const response = await fetch("fortune_data.json?t=" + Date.now(), {
            cache: "no-store",
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          fortuneData = await response.json();
        } catch (err) {
          console.warn("fortune_data.json 讀取失敗", err);
          fortuneData = {};
        }

        try {
          const response = await fetch("task_icons.json?t=" + Date.now(), {
            cache: "no-store",
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const rawTaskData = await response.json();
          taskData = Array.isArray(rawTaskData)
            ? rawTaskData
            : rawTaskData.tasks || [];
        } catch (err) {
          console.warn("task_icons.json 讀取失敗", err);
          taskData = [];
        }

        [yearSelect, monthSelect, staffSelect].forEach((el) => {
          el.addEventListener("change", renderCalendar);
        });

        renderCalendar();
        startClock();
      }

      function normalizeStaffName(value) {
        return String(value ?? "")
          .normalize("NFKC")
          .replace(/[\u200B-\u200D\uFEFF]/g, "")
          .replace(/\s+/g, "")
          .trim();
      }

      function extractStaffNames(value) {
        if (value == null) return [];

        let raw = "";
        if (typeof value === "string" || typeof value === "number") {
          raw = String(value);
        } else if (typeof value === "object" && !Array.isArray(value)) {
          const possibleNameKeys = [
            "name",
            "姓名",
            "staff",
            "person",
            "employee",
            "人員",
            "value",
          ];
          for (const key of possibleNameKeys) {
            if (
              typeof value[key] === "string" ||
              typeof value[key] === "number"
            ) {
              raw = String(value[key]);
              break;
            }
          }
        } else if (Array.isArray(value)) {
          return value.flatMap(extractStaffNames);
        }

        // 相容單一姓名，也容許同一欄位出現「、，,/／；;、換行」等多人格式。
        return raw
          .split(/[、,，/／;；\n\r]+/)
          .map((name) => String(name).trim())
          .filter(Boolean);
      }

      function extractStaffName(value) {
        return extractStaffNames(value)[0] || "";
      }

      function isValidStaffName(name) {
        const cleanName = normalizeStaffName(name);
        return (
          cleanName &&
          cleanName !== "-" &&
          cleanName !== "#SPILL!" &&
          cleanName !== "#溢出!" &&
          cleanName.toLowerCase() !== "null" &&
          cleanName.toLowerCase() !== "undefined" &&
          cleanName !== "[objectObject]" &&
          !/^\d+$/.test(cleanName) &&
          !/^[：:]+$/.test(cleanName)
        );
      }

      function populateStaff(data) {
        // 用正規化姓名當 key，避免全形/半形、隱藏字元或意外空白造成
        // 下拉選單看得到人，但查班時比對不到。
        const names = new Map();

        Object.entries(data).forEach(([date, shifts]) => {
          if (date === "lastUpdated") return;
          if (!shifts || typeof shifts !== "object" || Array.isArray(shifts))
            return;

          Object.values(shifts).forEach((shiftValue) => {
            extractStaffNames(shiftValue).forEach((name) => {
              if (!isValidStaffName(name)) return;
              const key = normalizeStaffName(name);
              if (!names.has(key)) names.set(key, String(name).trim());
            });
          });
        });

        staffSelect.innerHTML = '<option value="">-- 請選擇人員 --</option>';
        [...names.values()]
          .sort((a, b) => a.localeCompare(b, "zh-Hant"))
          .forEach((name) => staffSelect.options.add(new Option(name, name)));
      }

      function shiftContainsStaff(shiftValue, selectedStaff) {
        const target = normalizeStaffName(selectedStaff);
        if (!target) return false;
        return extractStaffNames(shiftValue).some(
          (name) => normalizeStaffName(name) === target,
        );
      }

      function renderToday() {
        yearSelect.value = now.getFullYear();
        monthSelect.value = now.getMonth();
        renderCalendar();
      }

      function getShiftStyle(shiftName) {
        const name = String(shiftName || "").trim();

        // 同一家族共用同一主色系；再依班別編號／名稱產生固定色階。
        // 例如：中班1、中班2、中班8都屬藍色系，但每個班別的藍會不同。
        const rules = [
          {
            test: /股長/,
            className: "shift-lead",
            icon: "★",
            hue: 42,
            span: 12,
          },
          {
            test: /專員/,
            className: "shift-special",
            icon: "◆",
            hue: 318,
            span: 20,
          },
          {
            test: /大夜|夜班|夜\d|127|128|大夜進口|大夜出口/,
            className: "shift-night",
            icon: "☾",
            hue: 258,
            span: 28,
          },
          {
            test: /中班|中\d|771|772/,
            className: "shift-mid",
            icon: "◐",
            hue: 210,
            span: 30,
          },
          {
            test: /早班|早\d/,
            className: "shift-early",
            icon: "☀",
            hue: 34,
            span: 24,
          },
          {
            test: /自運|嘉義|新營|接送/,
            className: "shift-field",
            icon: "▣",
            hue: 22,
            span: 22,
          },
          {
            test: /內檯|空袋檯/,
            className: "shift-office",
            icon: "▤",
            hue: 174,
            span: 22,
          },
          {
            test: /日班|白班/,
            className: "shift-day",
            icon: "●",
            hue: 142,
            span: 22,
          },
        ];

        const rule = rules.find((item) => item.test.test(name)) || {
          className: "shift-default",
          icon: "•",
          hue: 215,
          span: 18,
        };

        const numberMatch = name.match(/(?:班|中|早|夜)?\s*[（(]?\s*(\d{1,3})/);
        const numericSeed = numberMatch ? parseInt(numberMatch[1], 10) : null;

        // 沒有編號的班別用名稱雜湊，確保同名永遠取得相同色階。
        let hash = 0;
        for (const ch of name) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
        const seed = numericSeed ?? (hash % 17) + 1;

        // hue 只在家族主色附近小幅偏移，所以仍能一眼辨識為同一類。
        const hueOffset = ((seed * 7) % (rule.span * 2 + 1)) - rule.span;
        const hue = rule.hue + hueOffset;
        const lightness = 58 + ((seed * 5) % 13) - 6;
        const saturation = 78 + ((seed * 3) % 11) - 5;

        const inlineStyle = [
          `--shift-bg-1: hsla(${hue}, ${saturation}%, ${Math.min(64, lightness + 2)}%, .92)`,
          `--shift-bg-2: hsla(${hue + 14}, ${Math.max(62, saturation - 9)}%, ${Math.max(40, lightness - 11)}%, .82)`,
          `--shift-border: hsla(${hue}, ${Math.min(95, saturation + 5)}%, ${Math.min(82, lightness + 15)}%, .72)`,
          `--shift-accent: hsl(${hue}, ${Math.min(96, saturation + 7)}%, ${Math.min(84, lightness + 16)}%)`,
          `--shift-glow: hsla(${hue}, ${saturation}%, ${Math.min(70, lightness + 6)}%, .28)`,
        ].join("; ");

        return { ...rule, inlineStyle };
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function renderShiftTag(shift) {
        const style = getShiftStyle(shift);
        return `<div class="shift-tag ${style.className}" style="${style.inlineStyle}" title="${escapeHtml(shift)}">
          <span class="shift-icon" aria-hidden="true">${style.icon}</span>
          <span class="shift-name">${escapeHtml(shift)}</span>
        </div>`;
      }

      function normalizeTaskDate(value) {
        const digits = String(value || "").replace(/\D/g, "");
        if (digits.length !== 8) return "";
        return `${digits.slice(0, 4)}-${digits.slice(4, 6)}-${digits.slice(6, 8)}`;
      }

      function getTasksForDate(dateStr) {
        return taskData
          .filter((task) => {
            if (!task || task.enabled === false) return false;
            const start = normalizeTaskDate(
              task.start || task.startDate || task.起,
            );
            const end = normalizeTaskDate(
              task.end ||
                task.endDate ||
                task.訖 ||
                task.start ||
                task.startDate ||
                task.起,
            );
            return start && end && dateStr >= start && dateStr <= end;
          })
          .slice(0, 5);
      }

      function formatTaskPeriod(task) {
        const start = normalizeTaskDate(
          task.start || task.startDate || task.起,
        );
        const end = normalizeTaskDate(
          task.end ||
            task.endDate ||
            task.訖 ||
            task.start ||
            task.startDate ||
            task.起,
        );
        const fmt = (s) => (s ? s.replace(/-/g, "/") : "");
        return start === end ? fmt(start) : `${fmt(start)} ～ ${fmt(end)}`;
      }

      function taskHue(task, index) {
        if (task.colorHue != null && Number.isFinite(Number(task.colorHue))) {
          return Math.max(0, Math.min(360, Number(task.colorHue)));
        }
        const title = String(
          task.title || task.name || task.名稱 || "任務提醒",
        );
        let hash = 0;
        for (const ch of title) hash = (hash * 31 + ch.charCodeAt(0)) >>> 0;
        const palette = [192, 265, 330, 38, 152, 215, 18];
        return palette[(hash + index) % palette.length];
      }

      function renderTaskLabels(dateStr) {
        const tasks = getTasksForDate(dateStr);
        if (!tasks.length) return "";
        return `<span class="task-labels" aria-label="當日任務與檔期">${tasks
          .map((task, index) => {
            const title = task.title || task.name || task.名稱 || "任務提醒";
            const text =
              task.text || task.description || task.note || task.說明 || "";
            const tooltip = text ? `${title}｜${text}` : title;
            const hue = taskHue(task, index);
            return `<button type="button" class="task-label" style="--task-hue:${hue}" data-task-index="${index}" data-date="${escapeHtml(dateStr)}" data-tooltip="${escapeHtml(tooltip)}" aria-label="${escapeHtml(title)}" onclick="openTaskPopoverByDate('${escapeHtml(dateStr)}', ${index})"><span class="task-label-text">${escapeHtml(title)}</span></button>`;
          })
          .join("")}</span>`;
      }

      function openTaskPopoverByDate(dateStr, index) {
        const tasks = getTasksForDate(dateStr);
        const task = tasks[index];
        if (!task) return;
        const title = task.title || task.name || task.名稱 || "任務提醒";
        const text =
          task.text ||
          task.description ||
          task.note ||
          task.說明 ||
          "尚未設定說明。";
        document.getElementById("taskPopoverTitle").textContent = title;
        document.getElementById("taskPopoverPeriod").textContent =
          formatTaskPeriod(task);
        document.getElementById("taskPopoverText").textContent = text;
        const image = document.getElementById("taskPopoverImage");
        image.removeAttribute("src");
        image.style.display = "none";
        document.getElementById("taskPopover").classList.add("show");
      }

      function closeTaskPopover() {
        document.getElementById("taskPopover").classList.remove("show");
      }

      function renderCalendar() {
        const year = parseInt(yearSelect.value);
        const month = parseInt(monthSelect.value);
        const selectedStaff = staffSelect.value;

        calendarGrid.innerHTML = "";

        const firstDay = (new Date(year, month, 1).getDay() + 6) % 7; // 週一=0，週日=6
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          calendarGrid.innerHTML += `<div class="day-card other"></div>`;
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const dateObj = new Date(year, month, d);
          const weekDay = dateObj.getDay();

          const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

          const holidayName = holidays[dateStr] || "";

          const isHoliday = holidayName || weekDay === 0 || weekDay === 6;

          const isToday =
            year === now.getFullYear() &&
            month === now.getMonth() &&
            d === now.getDate();

          // 未選擇人員時，只顯示純月曆資訊。
          // 選擇人員後：整個日期沒有任何班表資料時顯示「尚未排班」；
          // 日期已有班表資料，但該人當日沒有班別時，才顯示「休」。
          let shiftsHtml = "";

          if (selectedStaff) {
            if (!scheduleData[dateStr]) {
              shiftsHtml = `
                <div class="not-scheduled-state" aria-label="尚未排班，請稍後查看">
                  <div class="not-scheduled-icon" aria-hidden="true">
                    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <defs>
                        <linearGradient id="calendarGradient-${year}-${month}-${d}" x1="10" y1="8" x2="55" y2="56" gradientUnits="userSpaceOnUse">
                          <stop stop-color="#C084FC"/>
                          <stop offset="0.48" stop-color="#A78BFA"/>
                          <stop offset="1" stop-color="#67E8F9"/>
                        </linearGradient>
                      </defs>
                      <rect x="10" y="14" width="44" height="39" rx="6" stroke="url(#calendarGradient-${year}-${month}-${d})" stroke-width="4"/>
                      <path d="M10 25H54" stroke="url(#calendarGradient-${year}-${month}-${d})" stroke-width="4" stroke-linecap="round"/>
                      <path d="M21 9V19M43 9V19" stroke="url(#calendarGradient-${year}-${month}-${d})" stroke-width="4" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <div class="not-scheduled-title">尚未排班</div>
                  <div class="not-scheduled-subtitle">• 請稍後查看 •</div>
                </div>
              `;
            } else {
              const dayShifts = scheduleData[dateStr];
              const myShifts = Object.keys(dayShifts).filter((key) =>
                shiftContainsStaff(dayShifts[key], selectedStaff),
              );

              if (myShifts.length > 0) {
                shiftsHtml = `
                <div class="shift-area">
                  ${myShifts.map(renderShiftTag).join("")}
                </div>
              `;
              } else {
                shiftsHtml =
                  "<div class='empty-text' aria-label='休假'>休</div>";
              }
            }
          }

          calendarGrid.innerHTML += `
          <div class="day-card ${isHoliday ? "holiday" : ""} ${isToday ? "today" : ""}">

            <div class="date-row">
              <div class="date-main">
                <div class="date-number-stack">
                  <div class="date-number">${d}</div>
                  <span class="lunar-date lunar-under-date">${escapeHtml(getLunarDate(dateObj))}</span>
                </div>
                <span class="day-info-line">
                  <span class="responsive-weekday ${weekDay === 0 || weekDay === 6 ? "weekend" : ""}">${["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"][weekDay]}</span>
                </span>
              </div>
              <div class="date-meta">
                ${getSolarTerm(year, month, d) ? `<span class="solar-term">${escapeHtml(getSolarTerm(year, month, d))}</span>` : ""}
                ${holidayName ? `<div class="holiday-tag">${escapeHtml(holidayName)}</div>` : ""}
              </div>
            </div>

            <div class="task-row">${renderTaskLabels(dateStr)}</div>

            ${shiftsHtml}

          </div>
        `;
        }
      }

      function startClock() {
        const liveClock = document.getElementById("liveClock");
        const liveDate = document.getElementById("liveDate");

        setInterval(() => {
          const now = new Date();

          liveClock.textContent = now.toLocaleTimeString("zh-TW", {
            hour12: false,
          });

          liveDate.textContent = now.toLocaleDateString("zh-TW", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
          });
        }, 1000);
      }

      document.getElementById("fortuneModal").addEventListener("click", (e) => {
        if (e.target.id === "fortuneModal") closeFortune();
      });

      document.getElementById("taskPopover").addEventListener("click", (e) => {
        if (e.target.id === "taskPopover") closeTaskPopover();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeFortune();
          closeTaskPopover();
        }
      });

      document.addEventListener("contextmenu", (e) => e.preventDefault());

      init();
    </script>
  </body>
</html>
