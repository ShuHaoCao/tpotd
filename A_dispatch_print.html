<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOMO進出口統計</title>
    <style>
      :root {
        --ink: #172033;
        --muted: #667085;
        --line: #25324a;
        --soft-line: #b8c2d1;
        --paper: #ffffff;
        --page-bg: #e9eef5;
        --green: #176b45;
        --green-soft: #e8f4ee;
        --blue: #245e9f;
        --blue-soft: #eaf1fa;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        color: var(--ink);
        background: var(--page-bg);
        font-family: "Microsoft JhengHei", "Noto Sans TC", Arial, sans-serif;
      }

      .app {
        max-width: 1180px;
        margin: 0 auto;
        padding: 22px;
      }

      .toolbar {
        margin-bottom: 16px;
        padding: 16px;
        border: 1px solid #d6deea;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 24px rgb(15 23 42 / 8%);
      }

      .toolbar h1 {
        margin: 0 0 12px;
        font-size: 22px;
      }

      .toolbar-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .file-picker {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border: 1px dashed #94a3b8;
        border-radius: 10px;
        background: #f8fafc;
        font-size: 14px;
        font-weight: 700;
      }

      .btn {
        border: 0;
        border-radius: 10px;
        padding: 11px 18px;
        font-weight: 800;
        cursor: pointer;
      }

      .btn-print {
        color: #fff;
        background: var(--green);
      }

      .btn-clear {
        color: #fff;
        background: #475467;
      }

      .btn-details {
        color: #fff;
        background: #7c3aed;
      }

      .hint {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.65;
      }

      .paper {
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto;
        padding: 8mm 8mm 7mm;
        border: 1px solid #cbd5e1;
        background: var(--paper);
        box-shadow: 0 16px 40px rgb(15 23 42 / 15%);
      }

      .report-header {
        margin-bottom: 4mm;
        padding-bottom: 1.6mm;
        border-bottom: 1.5px solid var(--blue);
      }

      .title-row {
        display: flex;
        align-items: flex-end;
        gap: 2.2mm;
        min-width: 0;
      }

      .title-momo {
        flex: 0 0 auto;
        font-size: 34px;
        font-weight: 900;
        line-height: 0.9;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .title-warehouse {
        flex: 0 0 auto;
        min-width: 22mm;
        padding-left: 2mm;
        border-left: 1.5px solid var(--blue);
        font-size: 11px;
        font-weight: 500;
        line-height: 1.05;
        white-space: nowrap;
      }

      .title-main {
        flex: 1 1 auto;
        min-width: 0;
        margin-left: 0.5mm;
        font-size: 25px;
        font-weight: 900;
        line-height: 0.95;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }

      .title-meta {
        display: flex;
        flex: 0 0 auto;
        align-items: baseline;
        gap: 4mm;
        padding-bottom: 0.4mm;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
      }

      .columns {
        display: grid;
        grid-template-columns: 1.09fr 0.91fr;
        gap: 3.2mm;
        align-items: start;
      }

      .report-column {
        min-width: 0;
        border: 1.5px solid var(--line);
        border-radius: 3mm;
        overflow: hidden;
        background: #fff;
      }

      .column-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        min-height: 12mm;
        padding: 2.1mm 2.5mm;
        color: #fff;
      }

      .inbound .column-heading {
        background: var(--green);
      }

      .outbound .column-heading {
        background: var(--blue);
      }

      .heading-main {
        display: flex;
        align-items: baseline;
        gap: 2mm;
      }

      .heading-main strong {
        font-size: 20px;
        letter-spacing: 0.18em;
      }

      .heading-main span {
        font-size: 12px;
        font-weight: 700;
        opacity: 0.88;
        letter-spacing: 0.05em;
      }

      .heading-total {
        padding: 0.8mm 1.2mm;
        border: 1px solid rgb(255 255 255 / 55%);
        border-radius: 999px;
        background: rgb(255 255 255 / 13%);
        font-size: 16px;
        font-weight: 900;
        white-space: nowrap;
      }

      .content {
        padding: 1.8mm;
      }

      .block {
        margin-bottom: 1.7mm;
        border: 1px solid var(--soft-line);
        border-radius: 2mm;
        overflow: hidden;
      }

      .block:last-child {
        margin-bottom: 0;
      }

      .block-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 3mm;
        min-height: 7mm;
        padding: 1.25mm 1.8mm;
        background: #f3f5f8;
        border-bottom: 1px solid var(--soft-line);
        font-size: 12.7px;
        font-weight: 900;
      }

      .inbound .block-title {
        background: var(--green-soft);
      }

      .outbound .block-title {
        background: var(--blue-soft);
      }

      .subtotal {
        color: #344054;
        font-size: 11.2px;
        font-weight: 900;
        white-space: nowrap;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      th,
      td {
        height: 7mm;
        padding: 0.75mm 0.85mm;
        border-right: 1px solid var(--soft-line);
        border-bottom: 1px solid var(--soft-line);
        text-align: center;
        vertical-align: middle;
        font-size: 13px;
        line-height: 1.08;
        word-break: normal;
        overflow-wrap: normal;
      }

      .inbound-table th:nth-child(2),
      .inbound-table td:nth-child(2) {
        white-space: nowrap;
        word-break: keep-all;
        overflow-wrap: normal;
        font-size: 13px;
      }

      .inbound-table th:nth-child(3),
      .inbound-table td:nth-child(3) {
        white-space: nowrap;
        word-break: keep-all;
        overflow-wrap: normal;
        font-size: 13px;
      }

      .inbound-table td:nth-child(3) {
        text-align: left;
        padding-left: 1.2mm;
      }

      .outbound-table th:nth-child(3),
      .outbound-table td:nth-child(3) {
        text-align: left;
        padding-left: 1.2mm;
        white-space: nowrap;
        word-break: keep-all;
        overflow-wrap: normal;
      }

      .outbound-table th,
      .outbound-table td {
        padding-left: 0.55mm;
        padding-right: 0.55mm;
        font-size: 13px;
      }

      .outbound-table th {
        font-size: 13px;
        line-height: 1.08;
      }

      /* 欄位對齊設定：編輯版與列印版共用 */
      .inbound-table th:nth-child(1),
      .inbound-table td:nth-child(1),
      .inbound-table th:nth-child(2),
      .inbound-table td:nth-child(2),
      .inbound-table th:nth-child(4),
      .inbound-table td:nth-child(4),
      .inbound-table th:nth-child(5),
      .inbound-table td:nth-child(5) {
        text-align: center;
      }

      .inbound-table th:nth-child(3),
      .inbound-table td:nth-child(3) {
        text-align: left;
        padding-left: 1.2mm;
      }

      .outbound-table th:nth-child(1),
      .outbound-table td:nth-child(1),
      .outbound-table th:nth-child(2),
      .outbound-table td:nth-child(2),
      .outbound-table th:nth-child(4),
      .outbound-table td:nth-child(4),
      .outbound-table th:nth-child(5),
      .outbound-table td:nth-child(5),
      .outbound-table th:nth-child(6),
      .outbound-table td:nth-child(6) {
        text-align: center;
      }

      .outbound-table th:nth-child(3),
      .outbound-table td:nth-child(3) {
        text-align: left;
        padding-left: 1.2mm;
        white-space: nowrap;
        word-break: keep-all;
        overflow-wrap: normal;
      }

      .package-input {
        display: block;
        width: 100%;
        height: 5.4mm;
        padding: 0.25mm 0.35mm;
        border: 1px solid #9fb0c7;
        border-radius: 1.2mm;
        background: #fff;
        color: var(--ink);
        text-align: center;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
        outline: none;
      }

      .package-input:focus,
      .mail-count-input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 1px rgb(36 94 159 / 18%);
      }

      .mail-count-input {
        display: block;
        width: 100%;
        height: 6mm;
        padding: 0.3mm 0.6mm;
        border: 1px solid #9fb0c7;
        border-radius: 1.2mm;
        background: #fff;
        color: var(--ink);
        text-align: center;
        font: inherit;
        font-size: 16px;
        font-weight: 900;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
        outline: none;
      }

      .outbound-stat-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .outbound-stat-item {
        min-width: 0;
        min-height: 12mm;
        padding: 1.25mm 1.5mm;
        border-right: 1px solid var(--soft-line);
        border-bottom: 1px solid var(--soft-line);
      }

      .outbound-stat-item:nth-child(2n) {
        border-right: 0;
      }

      .outbound-stat-item:nth-last-child(-n + 2) {
        border-bottom: 0;
      }

      .outbound-stat-label {
        display: block;
        margin-bottom: 0.8mm;
        color: #475467;
        font-size: 10px;
        font-weight: 800;
        line-height: 1.15;
        white-space: nowrap;
      }

      .outbound-stat-value {
        display: block;
        text-align: center;
        font-size: 16px;
        font-weight: 900;
        line-height: 1.15;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      .momo-value,
      .total-cart-value {
        font-weight: 900;
        font-variant-numeric: tabular-nums;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      th:last-child,
      td:last-child {
        border-right: 0;
      }

      th {
        height: 6.5mm;
        background: #fafbfc;
        font-size: 13px;
        font-weight: 900;
      }

      td.left {
        text-align: left;
      }

      .empty {
        color: #98a2b3;
      }

      .warehouse-line {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 2mm;
        align-items: center;
        min-height: 8.5mm;
        padding: 1.4mm 1.7mm;
        font-size: 13px;
      }

      .warehouse-line strong {
        font-size: 13px;
      }

      .badge {
        min-width: 16mm;
        padding: 0.8mm 1.2mm;
        border-radius: 999px;
        background: #eef2f6;
        text-align: center;
        font-weight: 900;
        white-space: nowrap;
      }

      .summary-strip {
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        gap: 3.2mm;
        margin-top: 3mm;
      }

      .summary-card {
        display: block;
        min-height: 18mm;
        padding: 1.8mm 2.4mm;
        border: 1.5px solid var(--line);
        border-radius: 2.5mm;
        font-weight: 900;
      }

      .summary-card.in {
        background: var(--green-soft);
      }

      .summary-card.out {
        background: var(--blue-soft);
      }

      .summary-label {
        display: block;
        margin-bottom: 0.8mm;
        font-size: 13px;
        letter-spacing: 0.08em;
      }

      .note-input {
        display: block;
        width: 100%;
        min-height: 9.5mm;
        resize: vertical;
        padding: 1.1mm 1.4mm;
        border: 1px solid #9aa7b8;
        border-radius: 1.5mm;
        background: rgb(255 255 255 / 72%);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.28;
      }

      .note-input::placeholder {
        color: #98a2b3;
        font-weight: 500;
      }

      .footer {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10mm;
        margin-top: 6mm;
        padding-top: 1mm;
        font-size: 13px;
        font-weight: 800;
      }

      .sign {
        min-height: 10mm;
        padding-top: 1.5mm;
        border-top: 1px solid var(--line);
      }

      .w-in-time {
        width: 15%;
      }
      .w-in-car {
        width: 15%;
      }
      .w-in-driver {
        width: 30%;
      }
      .w-in-work {
        width: 20%;
      }
      .w-in-cart {
        width: 20%;
      }
      .w-out-seq {
        width: 8%;
      }
      .w-out-time {
        width: 14%;
      }
      .w-out-car {
        width: 29%;
      }
      .w-out-momo {
        width: 20%;
      }
      .w-out-package {
        width: 14%;
      }
      .w-out-total {
        width: 15%;
      }

      @media (max-width: 900px) {
        .app {
          padding: 12px;
        }

        .paper {
          width: 100%;
          min-height: auto;
          padding: 16px;
        }

        .columns,
        .summary-strip {
          grid-template-columns: 1fr;
        }
      }

      @media print {
        html,
        body {
          width: 210mm;
          height: 297mm;
          background: #fff;
        }

        .app {
          width: 100%;
          max-width: none;
          padding: 0;
        }

        .toolbar {
          display: none !important;
        }

        .paper {
          width: 100%;
          min-height: 0;
          margin: 0;
          padding: 0;
          border: 0;
          box-shadow: none;
        }

        .report-column,
        .block,
        .summary-card {
          break-inside: avoid;
          page-break-inside: avoid;
        }

        .note-input {
          resize: none;
          overflow: hidden;
        }

        html,
        body,
        .paper,
        .report-column,
        .block,
        .block-title,
        .column-heading,
        .summary-card,
        th,
        td {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        .columns {
          display: grid !important;
          grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr) !important;
          gap: 4mm !important;
          align-items: start !important;
        }

        .inbound-table th:nth-child(3),
        .inbound-table td:nth-child(3) {
          white-space: nowrap !important;
          word-break: keep-all !important;
          overflow-wrap: normal !important;
          font-size: 13px;
          padding-left: 0.7mm;
          padding-right: 0.7mm;
        }

        .inbound-table th:nth-child(4),
        .inbound-table td:nth-child(4) {
          padding-left: 3mm;
          padding-right: 0.7mm;
          font-size: 13px;
          text-align: center;
        }

        .summary-strip {
          display: grid !important;
          grid-template-columns: 1.08fr 0.92fr !important;
          gap: 4mm !important;
        }

        .package-input {
          appearance: textfield;
          -moz-appearance: textfield;
          width: 100%;
          height: auto;
          min-height: 0;
          margin: 0;
          padding: 0;
          border: 0 !important;
          border-radius: 0;
          background: transparent !important;
          box-shadow: none !important;
          outline: 0 !important;
          color: var(--ink);
          text-align: center;
          font: inherit;
          font-size: 13px;
          font-weight: 800;
        }

        .package-input::-webkit-inner-spin-button,
        .package-input::-webkit-outer-spin-button,
        .mail-count-input::-webkit-inner-spin-button,
        .mail-count-input::-webkit-outer-spin-button {
          margin: 0;
          -webkit-appearance: none;
        }

        .mail-count-input {
          appearance: textfield;
          -moz-appearance: textfield;
          width: 100%;
          height: auto;
          min-height: 0;
          margin: 0;
          padding: 0;
          border: 0 !important;
          border-radius: 0;
          background: transparent !important;
          box-shadow: none !important;
          outline: 0 !important;
          color: var(--ink);
          text-align: center;
          font: inherit;
          font-size: 13px !important;
          font-weight: 900 !important;
          line-height: 1.15 !important;
          font-variant-numeric: tabular-nums;
        }

        .note-input {
          min-height: 9.5mm;
          padding: 0;
          border: 0 !important;
          border-radius: 0;
          background: transparent !important;
          box-shadow: none !important;
          outline: 0 !important;
        }

        .note-input::placeholder {
          color: transparent !important;
        }

        /* 列印大字最佳化：僅影響實際列印 */
        .title-momo {
          font-size: 34px !important;
        }

        .title-warehouse {
          font-size: 11px !important;
        }

        .title-main {
          font-size: 25px !important;
        }

        .title-meta {
          font-size: 11px !important;
        }

        .heading-main strong {
          font-size: 20px !important;
        }

        .heading-main span {
          font-size: 13px !important;
        }

        .heading-total {
          font-size: 13px !important;
        }

        .block-title {
          font-size: 13px !important;
        }

        .subtotal {
          font-size: 13px !important;
        }

        th,
        td {
          height: 7mm !important;
          padding-top: 0.7mm !important;
          padding-bottom: 0.7mm !important;
          line-height: 1.08 !important;
        }

        .inbound-table th,
        .inbound-table td {
          font-size: 12px !important;
        }

        .inbound-table th:nth-child(2),
        .inbound-table td:nth-child(2) {
          font-size: 13px !important;
          padding-left: 0.45mm !important;
          padding-right: 0.45mm !important;
          text-align: center;
        }

        .inbound-table th:nth-child(3),
        .inbound-table td:nth-child(3) {
          font-size: 13px !important;
          padding-left: 0.8mm !important;
          padding-right: 0.8mm !important;
          text-align: left;
        }

        .inbound-table td:nth-child(3) {
          text-align: left !important;
          padding-left: 0.8mm !important;
        }

        .inbound-table th:nth-child(4),
        .inbound-table td:nth-child(4) {
          font-size: 13px !important;
          padding-left: 0.4mm !important;
          padding-right: 0.4mm !important;
          white-space: nowrap !important;
          word-break: keep-all !important;
          overflow-wrap: normal !important;
        }

        .outbound-table th {
          font-size: 13px !important;
        }

        .outbound-table td {
          font-size: 13px !important;
        }

        .outbound-table th:nth-child(3),
        .outbound-table td:nth-child(3) {
          padding-left: 0.8mm !important;
          padding-right: 0.35mm !important;
        }

        /* 列印版欄位對齊：明確覆蓋一般樣式 */
        .inbound-table th:nth-child(1),
        .inbound-table td:nth-child(1),
        .inbound-table th:nth-child(2),
        .inbound-table td:nth-child(2),
        .inbound-table th:nth-child(4),
        .inbound-table td:nth-child(4),
        .inbound-table th:nth-child(5),
        .inbound-table td:nth-child(5) {
          text-align: center !important;
        }

        .inbound-table th:nth-child(3),
        .inbound-table td:nth-child(3) {
          text-align: left !important;
          padding-left: 1.2mm !important;
        }

        .outbound-table th:nth-child(1),
        .outbound-table td:nth-child(1),
        .outbound-table th:nth-child(2),
        .outbound-table td:nth-child(2),
        .outbound-table th:nth-child(4),
        .outbound-table td:nth-child(4),
        .outbound-table th:nth-child(5),
        .outbound-table td:nth-child(5),
        .outbound-table th:nth-child(6),
        .outbound-table td:nth-child(6) {
          text-align: center !important;
        }

        .outbound-table th:nth-child(3),
        .outbound-table td:nth-child(3) {
          text-align: left !important;
          padding-left: 1.2mm !important;
          padding-right: 0.35mm !important;
          white-space: nowrap !important;
          word-break: keep-all !important;
          overflow-wrap: normal !important;
        }

        .warehouse-line {
          font-size: 13px !important;
        }

        .warehouse-line strong {
          font-size: 13px !important;
          white-space: nowrap;
        }

        .outbound-stat-label {
          font-size: 10px !important;
        }

        .outbound-stat-value {
          font-size: 14px !important;
        }

        .badge {
          font-size: 13px !important;
        }

        .summary-label {
          font-size: 12px !important;
        }

        .note-input {
          font-size: 13px !important;
          line-height: 1.25 !important;
        }

        .footer {
          font-size: 13px !important;
        }

        @page {
          size: A4 portrait;
          margin: 7mm;
        }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <section class="toolbar">
        <h1>MOMO進出口統計表輸出列印</h1>
        <div class="toolbar-row">
          <label class="file-picker">
            進口資料檔：
            <input
              id="inboundFile"
              type="file"
              accept=".json,application/json"
            />
          </label>
          <label class="file-picker">
            出口資料檔：
            <input
              id="outboundFile"
              type="file"
              accept=".json,application/json"
            />
          </label>
          <label class="file-picker">
            既有詳情資料庫（選填）：
            <input
              id="detailsDatabaseFile"
              type="file"
              accept=".json,application/json"
            />
          </label>
          <button class="btn btn-print" type="button" onclick="window.print()">
            A4單張列印
          </button>
          <button
            class="btn btn-details"
            type="button"
            onclick="exportDetailsDatabase()"
          >
            更新詳情資料庫
          </button>
          <button class="btn btn-clear" type="button" onclick="resetData()">
            清空資料
          </button>
        </div>
        <div class="hint">
          匯入進出口資料檔案後，兩份資料會整合於同一張A4：左側為進口、右側為出口。列印時請選擇
          A4、直向、縮放100%，並關閉瀏覽器頁首頁尾。若要更新網頁詳情，先選擇既有
          details.json（第一次可不選），再按「更新詳情資料庫」；系統會保留舊日期並新增或覆蓋當天資料。
        </div>
      </section>

      <main class="paper">
        <header class="report-header">
          <div class="title-row">
            <div class="title-momo">MOMO</div>
            <div class="title-warehouse">新市倉SDC<br />永康倉DC7</div>
            <div class="title-main">進出口統計表</div>
            <div class="title-meta">
              <span>臺南郵局運輸股</span>
              <span class="dateText">—</span>
            </div>
          </div>
        </header>

        <section class="columns">
          <article class="report-column inbound">
            <div class="column-heading">
              <div class="heading-main">
                <strong>進口</strong>
                <span>INBOUND</span>
              </div>
              <div class="heading-total" id="inboundHeadingTotal">
                0 車次／0 籃車
              </div>
            </div>
            <div class="content" id="inboundContent"></div>
          </article>

          <article class="report-column outbound">
            <div class="column-heading">
              <div class="heading-main">
                <strong>出口</strong>
                <span>OUTBOUND</span>
              </div>
              <div class="heading-total" id="outboundHeadingTotal">
                0 車次／0 籃車
              </div>
            </div>
            <div class="content" id="outboundContent"></div>
          </article>
        </section>

        <section class="summary-strip">
          <label class="summary-card in">
            <span class="summary-label">進口備註</span>
            <textarea
              id="inboundNote"
              class="note-input"
              placeholder="點擊輸入資料"
            ></textarea>
          </label>
          <label class="summary-card out">
            <span class="summary-label">出口備註</span>
            <textarea
              id="outboundNote"
              class="note-input"
              placeholder="點擊輸入資料"
            ></textarea>
          </label>
        </section>

        <footer class="footer">
          <div class="sign">報表製作：曹書豪</div>
          <div class="sign">值班專員：曹書豪</div>
          <div class="sign">單位主管：王昭文</div>
        </footer>
      </main>
    </div>

    <script>
      const state = {
        inbound: null,
        outbound: null,
        outboundPackages: {},
        outboundMailCount: "",
        detailsDatabase: null,
      };
      const weekdays = ["日", "一", "二", "三", "四", "五", "六"];

      function todayRoc() {
        const d = new Date();
        d.setDate(d.getDate() - 1);
        return `${d.getFullYear() - 1911}年${d.getMonth() + 1}月${d.getDate()}日 星期${weekdays[d.getDay()]}`;
      }

      function n(value) {
        return Number(value) || 0;
      }

      function shortInboundCarNo(value) {
        const text = String(value ?? "").trim();
        if (!text) return "";
        const match = text.match(/第\s*(\d+)\s*車/);
        return match ? `第${match[1]}車` : text;
      }

      function formatLoad(value) {
        return Number.isFinite(value) ? `${value.toFixed(1)} 件` : "—";
      }

      function formatRatio(value) {
        return Number.isFinite(value) ? `${value.toFixed(2)} 倍` : "—";
      }

      function esc(value) {
        return String(value ?? "").replace(
          /[&<>\"]/g,
          (char) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[char],
        );
      }

      function setDateText() {
        let rocDate =
          state.inbound?.workDate?.rocDate ||
          state.outbound?.workDate?.rocDate ||
          todayRoc();

        // 自動將「日星期」改成「日 星期」
        rocDate = rocDate.replace(/日星期/g, "日 星期");

        document.querySelectorAll(".dateText").forEach((element) => {
          element.textContent = rocDate;
        });
      }

      function table(headers, rows, widths, tableClass = "") {
        const head = headers
          .map(
            (header, index) =>
              `<th class="${widths[index] || ""}">${esc(header)}</th>`,
          )
          .join("");
        return `<table class="${tableClass}"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
      }

      function cells(values) {
        return `<tr>${values
          .map(
            (item) =>
              `<td class="${item.className || ""}">${esc(item.value === 0 ? 0 : item.value || "")}</td>`,
          )
          .join("")}</tr>`;
      }

      function block(title, subtotalTrips, subtotalCarts, tableHtml) {
        return `
          <section class="block">
            <div class="block-title">
              <span>${esc(title)}</span>
              <span class="subtotal">${n(subtotalTrips)} 車／${n(subtotalCarts)} 籃</span>
            </div>
            ${tableHtml}
          </section>`;
      }

      function renderInbound() {
        const box = document.getElementById("inboundContent");
        const data = state.inbound?.inbound;

        if (!data) {
          box.innerHTML = `
            <section class="block">
              <div class="block-title"><span>進口資料</span><span class="subtotal">尚未匯入</span></div>
              <div class="warehouse-line empty">請先匯入資料檔案</div>
            </section>`;
          updateInboundTotals(0, 0);
          return;
        }

        let html = "";
        (data.stages || []).forEach((stage, index) => {
          let rows = (stage.rows || [])
            .map((row) =>
              cells([
                { value: row.time },
                { value: shortInboundCarNo(row.carNo) },
                { value: row.driver },
                { value: row.workItem, className: "left" },
                { value: n(row.carts) },
              ]),
            )
            .join("");

          if (!rows) {
            rows = cells([
              { value: "" },
              { value: "" },
              { value: "" },
              { value: "" },
              { value: "（無資料）", className: "left empty" },
              { value: "" },
            ]);
          }

          const tableHtml = table(
            ["時間", "車次", "運務員", "單位車次", "籃車數"],
            rows,
            ["w-in-time", "w-in-car", "w-in-driver", "w-in-work", "w-in-cart"],
            "inbound-table",
          );

          html += block(
            stage.stageName || `第${index + 1}階段`,
            stage.subtotalTrips,
            stage.subtotalCarts,
            tableHtml,
          );
        });

        const stages = data.stages || [];
        const xinshi = stages.reduce(
          (sum, stage) => ({
            trips: sum.trips + n(stage.subtotalTrips),
            carts: sum.carts + n(stage.subtotalCarts),
          }),
          { trips: 0, carts: 0 },
        );

        html += `
          <section class="block">
            <div class="block-title"><span>新市倉</span><span class="subtotal">第1＋2＋3階段</span></div>
            <div class="warehouse-line">
              <strong>新市倉(SDC)運載</strong>
              <span class="badge">${xinshi.trips} 車次</span>
              <span class="badge">${xinshi.carts} 籃車</span>
            </div>
          </section>`;

        const yongkang = data.yongkang || { trips: 0, carts: 0 };
        html += `
          <section class="block">
            <div class="block-title"><span>永康倉</span><span class="subtotal">獨立統計</span></div>
            <div class="warehouse-line">
              <strong>永康倉(DC7)運載</strong>
              <span class="badge">${n(yongkang.trips)} 車次</span>
              <span class="badge">${n(yongkang.carts)} 籃車</span>
            </div>
          </section>`;

        box.innerHTML = html;
        updateInboundTotals(data.totalTrips, data.totalCarts);
      }

      function packageKey(direction, rowIndex) {
        return `${direction}-${rowIndex}`;
      }

      function normalizePackageValue(value, total) {
        if (value === "" || value === null || value === undefined) return "";
        const parsed = Math.max(0, Math.floor(Number(value) || 0));
        return Math.min(parsed, n(total));
      }

      function outboundRow(direction, row, rowIndex) {
        const total = n(row.carts);
        const key = packageKey(direction, rowIndex);
        const stored = state.outboundPackages[key];
        const packageCarts = normalizePackageValue(stored, total);
        const momoCarts = total - (packageCarts === "" ? 0 : packageCarts);

        return `
          <tr>
            <td>${rowIndex + 1}</td>
            <td>${esc(row.time)}</td>
            <td class="left">${esc(row.carNo)}</td>
            <td class="momo-value" id="momo-${key}">${momoCarts}</td>
            <td>
              <input
                class="package-input"
                type="number"
                inputmode="numeric"
                min="0"
                max="${total}"
                step="1"
                value="${packageCarts}"
                aria-label="${esc(row.carNo)}包裹籃車數"
                data-package-key="${key}"
                data-total="${total}"
                oninput="updatePackageSplit(this)"
              />
            </td>
            <td class="total-cart-value">${total}</td>
          </tr>`;
      }

      function updatePackageSplit(input) {
        const key = input.dataset.packageKey;
        const total = n(input.dataset.total);
        let value = input.value;

        if (value !== "") {
          value = normalizePackageValue(value, total);
          input.value = value;
          state.outboundPackages[key] = value;
        } else {
          delete state.outboundPackages[key];
        }

        const packageCarts = value === "" ? 0 : n(value);
        const momoCell = document.getElementById(`momo-${key}`);
        if (momoCell) momoCell.textContent = Math.max(0, total - packageCarts);

        updateOutboundSummary();
      }

      function renderOutbound() {
        const box = document.getElementById("outboundContent");
        const data = state.outbound?.outbound;

        if (!data) {
          box.innerHTML = `
            <section class="block">
              <div class="block-title"><span>出口資料</span><span class="subtotal">尚未匯入</span></div>
              <div class="warehouse-line empty">請先匯入出口資料檔案</div>
            </section>`;
          updateOutboundTotals(0, 0);
          return;
        }

        let html = "";
        [
          ["北上", "north"],
          ["南下", "south"],
        ].forEach(([label, key]) => {
          const part = data[key] || { rows: [] };
          let rows = (part.rows || [])
            .map((row, rowIndex) => outboundRow(key, row, rowIndex))
            .join("");

          if (!rows) {
            rows = cells([
              { value: "" },
              { value: "（無資料）", className: "empty" },
              { value: "" },
              { value: "" },
              { value: "" },
            ]);
          }

          const tableHtml = table(
            ["序", "時間", "車次", "MOMO", "包裹", "合計"],
            rows,
            [
              "w-out-seq",
              "w-out-time",
              "w-out-car",
              "w-out-momo",
              "w-out-package",
              "w-out-total",
            ],
            "outbound-table",
          );

          html += block(
            label,
            part.subtotalTrips,
            part.subtotalCarts,
            tableHtml,
          );
        });

        html += `
          <section class="block">
            <div class="block-title">
              <span>出口分類統計</span>
              <span class="subtotal">依各車次包裹欄位自動彙整</span>
            </div>
            <div class="warehouse-line">
              <strong>包裹出口</strong>
              <span class="badge" id="packageExportTotal">0 籃車</span>
            </div>
            <div class="warehouse-line" style="border-top: 1px solid var(--soft-line)">
              <strong>MOMO出口</strong>
              <span class="badge" id="momoExportTotal">0 籃車</span>
            </div>
          </section>

          <section class="block">
            <div class="block-title">
              <span>出口裝載統計</span>
              <span class="subtotal">自動計算</span>
            </div>
            <div class="outbound-stat-grid">
              <label class="outbound-stat-item">
                <span class="outbound-stat-label">出口郵件數量</span>
                <input
                  id="outboundMailCount"
                  class="mail-count-input"
                  type="number"
                  inputmode="numeric"
                  min="0"
                  step="1"
                  value="${esc(state.outboundMailCount)}"
                  placeholder="手動輸入"
                  oninput="updateOutboundMailCount(this)"
                />
              </label>
              <div class="outbound-stat-item">
                <span class="outbound-stat-label">籃車裝載量</span>
                <span class="outbound-stat-value" id="cartLoadValue">—</span>
              </div>
              <div class="outbound-stat-item">
                <span class="outbound-stat-label">車次裝載量</span>
                <span class="outbound-stat-value" id="tripLoadValue">—</span>
              </div>
              <div class="outbound-stat-item">
                <span class="outbound-stat-label">進轉出籃車比</span>
                <span class="outbound-stat-value" id="cartRatioValue">—</span>
              </div>
            </div>
          </section>`;

        box.innerHTML = html;
        updateOutboundTotals(data.totalTrips, data.totalCarts);
        updateOutboundSummary();
      }

      function updateInboundTotals(trips, carts) {
        const text = `${n(trips)} 車次／${n(carts)} 籃車`;
        document.getElementById("inboundHeadingTotal").textContent = text;
      }

      function updateOutboundTotals(trips, carts) {
        const text = `${n(trips)} 車次／${n(carts)} 籃車`;
        document.getElementById("outboundHeadingTotal").textContent = text;
      }

      function calculateOutboundSplit() {
        const data = state.outbound?.outbound;
        let packageTotal = 0;
        let momoTotal = 0;

        if (!data) return { packageTotal, momoTotal };

        ["north", "south"].forEach((direction) => {
          (data[direction]?.rows || []).forEach((row, rowIndex) => {
            const total = n(row.carts);
            const key = packageKey(direction, rowIndex);
            const stored = state.outboundPackages[key];
            const packageValue = normalizePackageValue(stored, total);
            const packageCarts = packageValue === "" ? 0 : n(packageValue);

            packageTotal += packageCarts;
            momoTotal += Math.max(0, total - packageCarts);
          });
        });

        return { packageTotal, momoTotal };
      }

      function updateOutboundMailCount(input) {
        const value = input.value;
        state.outboundMailCount =
          value === "" ? "" : Math.max(0, Math.floor(Number(value) || 0));
        if (value !== "") input.value = state.outboundMailCount;
        updateOutboundSummary();
      }

      function updateOutboundSummary() {
        const outboundData = state.outbound?.outbound;
        const inboundData = state.inbound?.inbound;
        const { packageTotal, momoTotal } = calculateOutboundSplit();

        const packageTotalElement =
          document.getElementById("packageExportTotal");
        const momoTotalElement = document.getElementById("momoExportTotal");
        if (packageTotalElement)
          packageTotalElement.textContent = `${packageTotal} 籃車`;
        if (momoTotalElement)
          momoTotalElement.textContent = `${momoTotal} 籃車`;

        const mailCount =
          state.outboundMailCount === "" ? NaN : n(state.outboundMailCount);
        const outboundCarts = n(outboundData?.totalCarts);
        const outboundTrips = n(outboundData?.totalTrips);
        const inboundCarts = n(inboundData?.totalCarts);

        const cartLoad = outboundCarts > 0 ? mailCount / outboundCarts : NaN;
        const tripLoad = outboundTrips > 0 ? mailCount / outboundTrips : NaN;
        const cartRatio = inboundCarts > 0 ? outboundCarts / inboundCarts : NaN;

        const cartLoadElement = document.getElementById("cartLoadValue");
        const tripLoadElement = document.getElementById("tripLoadValue");
        const cartRatioElement = document.getElementById("cartRatioValue");

        if (cartLoadElement) cartLoadElement.textContent = formatLoad(cartLoad);
        if (tripLoadElement) tripLoadElement.textContent = formatLoad(tripLoad);
        if (cartRatioElement)
          cartRatioElement.textContent = formatRatio(cartRatio);
      }

      function render() {
        setDateText();
        renderInbound();
        renderOutbound();
        updateOutboundSummary();
      }

      function getReportDate() {
        const date =
          state.inbound?.workDate?.date || state.outbound?.workDate?.date || "";
        if (/^\d{4}-\d{2}-\d{2}$/.test(date)) return date;

        const roc =
          state.inbound?.workDate?.rocDate ||
          state.outbound?.workDate?.rocDate ||
          "";
        const match = String(roc).match(/(\d+)年(\d+)月(\d+)日/);
        if (!match) return "";
        const year = Number(match[1]) + 1911;
        return `${year}-${String(match[2]).padStart(2, "0")}-${String(match[3]).padStart(2, "0")}`;
      }

      function buildDetailsRecord() {
        const date = getReportDate();
        if (!date) throw new Error("找不到報表日期");
        if (!state.inbound?.inbound && !state.outbound?.outbound) {
          throw new Error("尚未匯入進出口資料");
        }

        const inbound = state.inbound?.inbound || {
          stages: [],
          yongkang: { trips: 0, carts: 0 },
          totalTrips: 0,
          totalCarts: 0,
        };
        const outbound = state.outbound?.outbound || {
          north: { rows: [], subtotalTrips: 0, subtotalCarts: 0 },
          south: { rows: [], subtotalTrips: 0, subtotalCarts: 0 },
          totalTrips: 0,
          totalCarts: 0,
        };

        const exportDirection = (direction) => {
          const part = outbound[direction] || { rows: [] };
          const rows = (part.rows || []).map((row, rowIndex) => {
            const total = n(row.carts);
            const stored =
              state.outboundPackages[packageKey(direction, rowIndex)];
            const normalized = normalizePackageValue(stored, total);
            const packageCarts = normalized === "" ? 0 : n(normalized);
            return {
              sequence: rowIndex + 1,
              time: row.time || "",
              carNo: row.carNo || "",
              momoCarts: Math.max(0, total - packageCarts),
              packageCarts,
              totalCarts: total,
            };
          });
          return {
            rows,
            subtotalTrips: n(part.subtotalTrips) || rows.length,
            subtotalCarts:
              n(part.subtotalCarts) ||
              rows.reduce((sum, row) => sum + row.totalCarts, 0),
          };
        };

        const north = exportDirection("north");
        const south = exportDirection("south");
        const { packageTotal, momoTotal } = calculateOutboundSplit();
        const mailCount =
          state.outboundMailCount === "" ? null : n(state.outboundMailCount);
        const outboundCarts = n(outbound.totalCarts);
        const outboundTrips = n(outbound.totalTrips);
        const inboundCarts = n(inbound.totalCarts);

        return {
          date,
          rocDate:
            state.inbound?.workDate?.rocDate ||
            state.outbound?.workDate?.rocDate ||
            "",
          weekday:
            state.inbound?.workDate?.weekday ||
            state.outbound?.workDate?.weekday ||
            "",
          unit: "臺南郵局運輸股",
          title: "MOMO進出口統計表",
          generatedAt: new Date().toISOString(),
          inbound: {
            stages: (inbound.stages || []).map((stage, index) => ({
              stageName: stage.stageName || `第${index + 1}階段`,
              rows: (stage.rows || []).map((row) => ({
                time: row.time || "",
                carNo: shortInboundCarNo(row.carNo),
                driver: row.driver || "",
                workItem: row.workItem || "",
                carts: n(row.carts),
              })),
              subtotalTrips: n(stage.subtotalTrips),
              subtotalCarts: n(stage.subtotalCarts),
            })),
            yongkang: {
              trips: n(inbound.yongkang?.trips),
              carts: n(inbound.yongkang?.carts),
            },
            totalTrips: n(inbound.totalTrips),
            totalCarts: n(inbound.totalCarts),
            note: document.getElementById("inboundNote").value.trim(),
          },
          outbound: {
            north,
            south,
            totalTrips: n(outbound.totalTrips),
            totalCarts: outboundCarts,
            momoTotal,
            packageTotal,
            mailCount,
            averagePerCart: Number.isFinite(mailCount / outboundCarts)
              ? mailCount / outboundCarts
              : null,
            averagePerTrip: Number.isFinite(mailCount / outboundTrips)
              ? mailCount / outboundTrips
              : null,
            outboundInboundRatio: Number.isFinite(outboundCarts / inboundCarts)
              ? outboundCarts / inboundCarts
              : null,
            note: document.getElementById("outboundNote").value.trim(),
          },
          signatures: {
            maker: "曹書豪",
            dutyOfficer: "曹書豪",
            supervisor: "王昭文",
          },
        };
      }

      function downloadJson(data, filename) {
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      function exportDetailsDatabase() {
        try {
          const record = buildDetailsRecord();
          const source =
            state.detailsDatabase && typeof state.detailsDatabase === "object"
              ? state.detailsDatabase
              : {};
          const database = {
            schema: "tainan_post_momo_details.v1",
            title: "MOMO進出口統計詳情資料庫",
            updatedAt: new Date().toISOString(),
            reports: {
              ...(source.reports && typeof source.reports === "object"
                ? source.reports
                : {}),
              [record.date]: record,
            },
          };
          const sortedReports = {};
          Object.keys(database.reports)
            .sort()
            .forEach((key) => (sortedReports[key] = database.reports[key]));
          database.reports = sortedReports;
          downloadJson(database, "details.json");
          alert(
            `已更新 ${record.date} 詳情資料。請以新下載的 details.json 覆蓋網站上的舊檔。`,
          );
        } catch (error) {
          console.error(error);
          alert(error.message || "詳情資料匯出失敗");
        }
      }

      async function loadDetailsDatabase(file) {
        if (!file) {
          state.detailsDatabase = null;
          return;
        }
        try {
          const data = JSON.parse(await file.text());
          if (
            !data ||
            typeof data !== "object" ||
            !data.reports ||
            typeof data.reports !== "object"
          ) {
            throw new Error("不是有效的 details.json");
          }
          state.detailsDatabase = data;
        } catch (error) {
          state.detailsDatabase = null;
          console.error(error);
          alert(
            "既有詳情資料庫讀取失敗，請確認是否為正確的 details.json。\n若是第一次建立，可不選擇此檔案。",
          );
        }
      }

      function resetData() {
        state.inbound = null;
        state.outbound = null;
        state.outboundPackages = {};
        state.outboundMailCount = "";
        document.getElementById("inboundFile").value = "";
        document.getElementById("outboundFile").value = "";
        document.getElementById("detailsDatabaseFile").value = "";
        state.detailsDatabase = null;
        document.getElementById("inboundNote").value = "";
        document.getElementById("outboundNote").value = "";
        render();
      }

      async function loadFile(file, type) {
        if (!file) return;

        try {
          const data = JSON.parse(await file.text());
          state[type] = data;
          if (type === "outbound") {
            state.outboundPackages = {};
            state.outboundMailCount = "";
          }
          render();
        } catch (error) {
          console.error(error);
          alert("資料檔案讀取失敗，請確認檔案格式是否正確。");
        }
      }

      document
        .getElementById("inboundFile")
        .addEventListener("change", (event) => {
          loadFile(event.target.files[0], "inbound");
        });

      document
        .getElementById("outboundFile")
        .addEventListener("change", (event) => {
          loadFile(event.target.files[0], "outbound");
        });

      document
        .getElementById("detailsDatabaseFile")
        .addEventListener("change", (event) => {
          loadDetailsDatabase(event.target.files[0]);
        });

      window.addEventListener("beforeprint", () => {
        if (document.activeElement instanceof HTMLElement) {
          document.activeElement.blur();
        }
      });

      render();
    </script>
  </body>
</html>
