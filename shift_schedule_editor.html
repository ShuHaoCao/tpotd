<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>班表資料編輯器</title>
    <style>
      :root {
        --primary-color: #4a69bd;
        --secondary-color: #78e08f;
        --accent-color: #fa983a;
        --bg-color: #f1f2f6;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background-color: var(--bg-color);
        margin: 0;
        padding: 10px;
        color: #2f3542;
      }

      .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      }

      h2 {
        text-align: center;
        color: var(--primary-color);
        margin-bottom: 20px;
        font-size: 1.5rem;
      }

      .section {
        background: #ffffff;
        margin-bottom: 15px;
        padding: 15px;
        border: 1px solid #e1e4e8;
        border-radius: 8px;
      }

      .section-title {
        font-weight: bold;
        margin-bottom: 10px;
        display: block;
        color: #57606f;
      }

      /* 檔案讀取區 */
      .file-upload-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* 編輯列響應式設計 */
      .edit-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #f1f2f6;
      }

      label {
        flex: 0 0 100px;
        font-weight: 500;
        font-size: 0.95rem;
      }

      select,
      input[type="date"] {
        flex: 1;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 1rem;
        background-color: #fff;
        appearance: none; /* 去除原生箭頭 */
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2724%27%20height%3D%2724%27%20viewBox%3D%270%200%2024%2024%27%20fill%3D%27none%27%20stroke%3D%27%23ccc%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Cpolyline%20points%3D%276%209%2012%2015%2018%209%27%3E%3C/polyline%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 8px center;
        background-size: 18px;
      }

      /* 手機版調整 */
      @media (max-width: 480px) {
        .edit-row {
          flex-direction: column;
          align-items: flex-start;
        }
        label {
          margin-bottom: 5px;
          flex: none;
          width: 100%;
        }
        select,
        input[type="date"] {
          width: 100%;
          box-sizing: border-box;
        }
        h2 {
          font-size: 1.2rem;
        }
      }

      .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 20px;
      }

      .btn {
        padding: 12px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        font-size: 1rem;
        transition: opacity 0.2s;
        text-align: center;
        display: inline-block;
        text-decoration: none;
      }

      .btn:active {
        opacity: 0.7;
      }
      .btn-load {
        background-color: var(--primary-color);
        width: 100%;
      }
      .btn-save {
        background-color: var(--secondary-color);
        color: #1e370a;
      }
      .btn-export {
        background-color: var(--accent-color);
      }

      #status {
        font-size: 0.85rem;
        color: #eb4d4b;
        margin-top: 5px;
      }
      #dateStatus {
        font-size: 0.8rem;
        display: block;
        margin-top: 5px;
      }

      .sticky-footer {
        position: sticky;
        bottom: 0;
        background: white;
        padding: 10px 0;
        border-top: 1px solid #ddd;
        margin-top: 20px;
      }
      footer {
        text-align: center;
        padding: 20px 10px;
        font-size: 0.85em;
        color: #999;
      }

      .shift-edit-group {
        width: 100%;
      }

      .shift-main-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .shift-main-row label {
        flex: 0 0 100px;
      }

      .status-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 8px 0 4px 112px;
      }

      .status-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .status-item span {
        font-size: 0.85rem;
        color: #57606f;
        white-space: nowrap;
      }

      .status-item select {
        width: 100%;
        padding: 7px 30px 7px 8px;
        font-size: 0.9rem;
      }

      @media (max-width: 600px) {
        .shift-main-row {
          flex-direction: column;
          align-items: stretch;
          gap: 6px;
        }

        .shift-main-row label {
          flex: none;
          width: 100%;
        }

        .status-row {
          margin-left: 0;
          grid-template-columns: 1fr;
        }

        .status-item {
          display: grid;
          grid-template-columns: 52px 1fr;
        }
      }

      /* ===== 分區與修改追蹤 ===== */
      #fieldsContainer {
        display: block;
      }

      .shift-section {
        border: 1px solid #d9e2ec;
        border-radius: 14px;
        margin: 16px 0;
        overflow: hidden;
        background: #fff;
      }

      .shift-section-header {
        padding: 14px 18px;
        font-size: 1.08rem;
        font-weight: 800;
        background: #f4f7fb;
        border-bottom: 1px solid #d9e2ec;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .shift-section-count {
        font-size: 0.82rem;
        font-weight: 600;
        color: #6b7280;
      }

      .shift-section-body {
        padding: 0 16px;
      }

      .edit-row {
        position: relative;
        transition:
          background-color 0.18s ease,
          box-shadow 0.18s ease;
      }

      .edit-row.is-modified {
        background: #fff7d6;
        box-shadow: inset 5px 0 0 #f39c12;
        border-radius: 8px;
        padding-left: 10px;
        padding-right: 8px;
      }

      .edit-row.is-modified::after {
        content: "已修改";
        position: absolute;
        top: 8px;
        right: 8px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 800;
        background: #f39c12;
        color: white;
        pointer-events: none;
      }

      .field-modified {
        border: 2px solid #f39c12 !important;
        background: #fffaf0 !important;
      }

      .change-summary {
        display: none;
        margin: 14px 0 4px;
        padding: 12px 14px;
        border: 1px solid #f4c36a;
        border-radius: 10px;
        background: #fff8e8;
        color: #6b4b00;
        font-weight: 700;
      }

      .change-summary.show {
        display: block;
      }

      .change-summary small {
        display: block;
        margin-top: 4px;
        font-weight: 500;
        color: #7b6b47;
      }

      .toolbar-note {
        margin-top: 8px;
        color: #6b7280;
        font-size: 0.88rem;
      }

      @media (max-width: 600px) {
        .shift-section-body {
          padding: 0 10px;
        }
        .edit-row.is-modified::after {
          position: static;
          display: inline-block;
          margin: 6px 0 4px;
        }
      }

      .shift-label-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 100px;
      }

      .shift-label-wrap label {
        flex: 1 1 auto;
        margin: 0;
      }

      .btn-clear-shift {
        border: 1px solid #e57373;
        background: #fff5f5;
        color: #c0392b;
        border-radius: 7px;
        padding: 5px 8px;
        font-size: 0.75rem;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
      }

      .btn-clear-shift:hover {
        background: #ffe6e6;
      }

      @media (max-width: 600px) {
        .shift-label-wrap {
          flex: none;
          width: 100%;
        }
      }
    </style>
  </head>

    <div class="container">

      <div class="section">
        <span class="section-title">第1步：載入來源</span>
        <div class="file-upload-group">
          <input type="file" id="fileInput" accept=".json" />
          <button class="btn btn-load" onclick="loadFile()">

          </button>
        </div>
        <div id="status"></div>
      </div>

      <div id="editorArea" style="display: none">
        <div class="section">
          <span class="section-title">第2步：選取日期</span>

          <span id="dateStatus"></span>
        </div>

        <div class="section">
          <span class="section-title">第3步：編輯人員</span>
          <div id="changeSummary" class="change-summary">
            ✏️ 本日期已有修改
            <small id="changeSummaryText"></small>
          </div>
          <div id="fieldsContainer"></div>
        </div>

        <div class="sticky-footer">
          <div class="btn-group">
            <button class="btn btn-save" type="button" disabled>
              自動更新記憶體
            </button>
            <button class="btn btn-export" onclick="exportJSON()">
              匯出完整 JSON
            </button>
          </div>
        </div>
      </div>
    </div>

          "吳佳錚",
          "周恆毅",
          "周耀宗",
          "-",
        ],
        "中1(六日)": [, "-"],
        自運甲線: [
          "陳柏宇",
          "沈銘展",
          "邱俊融",
          "程世桓",
          "周恆毅",
          "翁志峰",
          "吳佳錚",
          "張智雄",
          "陳柏林",
          "周耀宗",
          "葉育宏",
          "-",
        ],
        自運乙線: [
          "吳佳錚",
          "沈銘展",
          "葉育宏",
          "王寶生",
          "程世桓",
          "莊景宇",
          "邱俊融",
          "葉吉順",
          "-",
        ],
        "夜1(六日)": [
          "陳柏林",
          "葉吉順",
          "周恆毅",
          "莊世明",
          "金哲駿",
          "張正德",
          "施以平",
          "葉育宏",
          "邱俊融",
          "-",
        ],
        進口接送: ["蔡綜哲", "吳政謙", "柯國超", "-"],
        出口接送: ["蔡綜哲", "吳政謙", "柯國超", "-"],
        "支　援 1": [, "-"],
        "支　援 2": [, "-"],
        "支　援 3": [, "-"],
        "支　援 4": [, "-"],
        "見　習 1": [, "-"],
        "見　習 2": [, "-"],
      };

      let loadedFileName = "schedule_data.json";
      let currentDate = "";
      let isDirty = false;
      let originalSnapshot = {};
      let modifiedByDate = {};

      function deepClone(obj) {
        return JSON.parse(JSON.stringify(obj));
      }

      function classifyShift(shift) {
        const s = String(shift);

        if (
          s.includes("股長") ||
          s.includes("專員") ||
          s.includes("內檯") ||
          s.includes("空袋")
        )
          return "管理／內勤";

        if (
          s.includes("早") ||
          s.includes("新營") ||
          s.includes("自運") ||
          s.includes("嘉義")
        )
          return "早班";

        if (
          s.includes("中班") ||
          /^中\d/.test(s) ||
          s.includes("771") ||
          s.includes("772")
        )
          return "中班";

        if (
          s.includes("夜") ||
          s.includes("大夜") ||
          s.includes("127") ||
          s.includes("128")
        )
          return "晚班／大夜";

        return "其他班別";
      }

      function getOriginalValue(date, shift, fieldKey) {
        const day = originalSnapshot?.[date];
        if (!day || !day[shift]) return undefined;

        if (fieldKey === "人員") {
          return typeof day[shift].name === "string" ? day[shift].name : "";
        }

        return day[shift].status &&
          typeof day[shift].status[fieldKey] === "string"
          ? day[shift].status[fieldKey]
          : "";
      }

      function getCurrentValue(date, shift, fieldKey) {
        const day = scheduleData?.[date];
        if (!day || !day[shift]) return undefined;

        if (fieldKey === "人員") {
          return typeof day[shift].name === "string" ? day[shift].name : "";
        }

        return day[shift].status &&
          typeof day[shift].status[fieldKey] === "string"
          ? day[shift].status[fieldKey]
          : "";
      }

      function isFieldActuallyModified(date, shift, fieldKey) {
        return (
          getCurrentValue(date, shift, fieldKey) !==
          getOriginalValue(date, shift, fieldKey)
        );
      }

      function syncModifiedState(date, shift, fieldKey, element) {
        if (!modifiedByDate[date]) modifiedByDate[date] = new Set();

        const token = `${shift}｜${fieldKey}`;
        const changed = isFieldActuallyModified(date, shift, fieldKey);

        if (changed) {
          modifiedByDate[date].add(token);
          if (element) element.classList.add("field-modified");
        } else {
          modifiedByDate[date].delete(token);
          if (element) element.classList.remove("field-modified");
        }

        if (modifiedByDate[date].size === 0) {
          delete modifiedByDate[date];
        }

        const row = element ? element.closest(".edit-row") : null;
        if (row) {
          const rowChanged = [...(modifiedByDate[date] || [])].some((x) =>
            x.startsWith(`${shift}｜`),
          );

          row.classList.toggle("is-modified", rowChanged);
        }

        refreshChangeSummary(date);
      }

      function refreshChangeSummary(date) {
        const box = document.getElementById("changeSummary");
        const text = document.getElementById("changeSummaryText");
        if (!box || !text) return;

        const changes = modifiedByDate[date];
        const count = changes ? changes.size : 0;

        if (!count) {
          box.classList.remove("show");
          text.textContent = "";
          return;
        }

        box.classList.add("show");
        text.textContent = `目前共 ${count} 個欄位與原始載入資料不同；若改回原值，標記會自動取消。`;
      }

      function isDateKey(key) {
        return (
          /^\d{4}-\d{2}-\d{2}$/.test(key) &&
          scheduleData[key] &&
          typeof scheduleData[key] === "object" &&
          !Array.isArray(scheduleData[key])
        );
      }

      function getDateKeys() {
        return Object.keys(scheduleData).filter(isDateKey).sort();
      }

      function isNewStructureDay(day) {
        if (!day || typeof day !== "object" || Array.isArray(day)) return false;

        const values = Object.values(day);
        if (!values.length) return false;

        return values.every(
          (item) =>
            item &&
            typeof item === "object" &&
            !Array.isArray(item) &&
            Object.prototype.hasOwnProperty.call(item, "name") &&
            item.status &&
            typeof item.status === "object" &&
            !Array.isArray(item.status),
        );
      }

      function getNewStructureDates() {
        return getDateKeys().filter((date) =>
          isNewStructureDay(scheduleData[date]),
        );
      }

      function getStatusOptions() {
        const values = new Set(["", "OK", "V"]);

        getNewStructureDates().forEach((date) => {
          Object.values(scheduleData[date]).forEach((item) => {
            Object.values(item.status || {}).forEach((status) => {
              if (typeof status === "string") values.add(status);
            });
          });
        });

        return Array.from(values);
      }

      function loadFile() {
        const file = document.getElementById("fileInput").files[0];
        if (!file) return alert("請先選擇 JSON 檔案");

        loadedFileName = file.name || "schedule_data.json";

        const reader = new FileReader();
        reader.onload = function (e) {
          try {
            const parsed = JSON.parse(e.target.result.replace(/^\uFEFF/, ""));

            if (
              !parsed ||
              typeof parsed !== "object" ||
              Array.isArray(parsed)
            ) {
              throw new Error("JSON 根節點必須是物件");
            }

            scheduleData = parsed;
            originalSnapshot = deepClone(parsed);
            modifiedByDate = {};

            const dates = getDateKeys();
            const newDates = getNewStructureDates();

            if (!dates.length) {
              throw new Error("找不到 YYYY-MM-DD 格式的日期資料");
            }

            if (!newDates.length) {
              throw new Error("找不到新版 name/status 班表資料");
            }

            extractAllStaff();

            document.getElementById("editorArea").style.display = "block";
            document.getElementById("status").innerText =
              `✅ 已完整載入 ${dates.length} 天資料；可編輯新版資料 ${newDates.length} 天`;
            document.getElementById("status").style.color = "green";

            const picker = document.getElementById("datePicker");
            picker.min = newDates[0];
            picker.removeAttribute("max");
            picker.value = newDates[newDates.length - 1];

            currentDate = "";
            isDirty = false;
            loadDateData();
          } catch (err) {
            console.error(err);
            alert("檔案格式錯誤：" + err.message);
          }
        };
        reader.readAsText(file, "utf-8");
      }

      function getShiftName(value) {
        if (typeof value === "string") {
          return value === "-" ? "" : value;
        }

        if (
          value &&
          typeof value === "object" &&
          !Array.isArray(value) &&
          typeof value.name === "string"
        ) {
          return value.name === "-" ? "" : value.name;
        }

        return "";
      }

      function extractAllStaff() {
        // 人員選單完全採用人工設定，不再從 JSON 自動擷取姓名。
        allStaff = [
          ...new Set(
            MANUAL_STAFF_LIST.filter((name) => typeof name === "string")
              .map((name) => name.trim())
              .filter(
                (name) =>
                  name &&
                  name !== "-" &&
                  name !== "未排班" &&
                  name !== "(空白)" &&
                  name !== "#溢出!" &&
                  name !== "OK" &&
                  name !== "V",
              ),
          ),
        ].sort((a, b) => a.localeCompare(b, "zh-Hant"));
      }

      function createBlankDayTemplate() {
        const newDates = getNewStructureDates();
        if (!newDates.length) return {};

        const source = scheduleData[newDates[newDates.length - 1]];

        const blank = JSON.parse(JSON.stringify(source));

        Object.values(blank).forEach((item) => {
          item.name = "";

          if (item.status && typeof item.status === "object") {
            Object.keys(item.status).forEach((region) => {
              item.status[region] = "";
            });
          }
        });

        return blank;
      }

      function loadDateData() {
        const selectedDate = document.getElementById("datePicker").value;
        const container = document.getElementById("fieldsContainer");
        const dateStatus = document.getElementById("dateStatus");
        container.innerHTML = "";

        if (!selectedDate) return;
        currentDate = selectedDate;

        let dayData = scheduleData[selectedDate];
        const exists = !!dayData;

        if (exists && !isNewStructureDay(dayData)) {
          dateStatus.innerText =
            "ℹ️ 此日期為舊版歷史資料；資料會保留在 JSON 中，但新版編輯器不修改它。";
          dateStatus.style.color = "#7f8c8d";
          refreshChangeSummary(selectedDate);
          return;
        }

        if (!exists) {
          dayData = createBlankDayTemplate();
          dateStatus.innerText =
            "ℹ️ 此日期尚無資料；第一次修改時會用新版結構建立。";
          dateStatus.style.color = "orange";
        } else {
          dateStatus.innerText = "✅ 已載入新版資料；所有修改會立即更新記憶體";
          dateStatus.style.color = "green";
        }

        const availableStatuses = getStatusOptions();
        const sectionOrder = [
          "管理／內勤",
          "早班",
          "中班",
          "晚班／大夜",
          "其他班別",
        ];
        const sections = {};

        sectionOrder.forEach((name) => {
          sections[name] = [];
        });

        Object.keys(dayData).forEach((shift) => {
          const category = classifyShift(shift);
          sections[category].push(shift);
        });

        sectionOrder.forEach((sectionName) => {
          const shifts = sections[sectionName];
          if (!shifts.length) return;

          const section = document.createElement("section");
          section.className = "shift-section";

          const header = document.createElement("div");
          header.className = "shift-section-header";

          const title = document.createElement("span");
          title.textContent = sectionName;

          const count = document.createElement("span");
          count.className = "shift-section-count";
          count.textContent = `${shifts.length} 個班別`;

          header.appendChild(title);
          header.appendChild(count);

          const body = document.createElement("div");
          body.className = "shift-section-body";

          shifts.forEach((shift) => {
            const item = dayData[shift];
            if (!item || typeof item !== "object" || Array.isArray(item))
              return;

            const wrapper = document.createElement("div");
            wrapper.className = "edit-row";
            wrapper.dataset.shift = shift;

            const group = document.createElement("div");
            group.className = "shift-edit-group";

            const mainRow = document.createElement("div");
            mainRow.className = "shift-main-row";

            const labelWrap = document.createElement("div");
            labelWrap.className = "shift-label-wrap";

            const label = document.createElement("label");
            label.innerText = shift;

            const clearBtn = document.createElement("button");
            clearBtn.type = "button";
            clearBtn.className = "btn-clear-shift";
            clearBtn.textContent = "清除";
            clearBtn.title = `清除 ${shift} 的人員與地區狀態`;

            labelWrap.appendChild(label);
            labelWrap.appendChild(clearBtn);

            const personSelect = document.createElement("select");
            const currentName =
              typeof item.name === "string" ? item.name.trim() : "";

            // 所有班別的人員下拉選單都使用人工設定的 MANUAL_STAFF_LIST，並自動去重。
            let names = [...allStaff];

            // 若目前班別已有姓名，但因資料範圍等原因不在名單內，
            // 仍保留目前姓名，避免載入後無法顯示。
            if (currentName && !names.includes(currentName)) {
              names.unshift(currentName);
            }

            names = [...new Set(names)];

            const unassigned = document.createElement("option");
            unassigned.value = "";
            unassigned.textContent = "未排班";
            unassigned.selected = currentName === "";
            personSelect.appendChild(unassigned);

            names.forEach((name) => {
              const opt = document.createElement("option");
              opt.value = name;
              opt.textContent = name;
              opt.selected = name === currentName;
              personSelect.appendChild(opt);
            });

            mainRow.appendChild(labelWrap);
            mainRow.appendChild(personSelect);
            group.appendChild(mainRow);

            const statusRow = document.createElement("div");
            statusRow.className = "status-row";
            const statusObj = item.status || {};
            const statusSelectMap = {};

            Object.keys(statusObj).forEach((region) => {
              const statusItem = document.createElement("div");
              statusItem.className = "status-item";

              const regionLabel = document.createElement("span");
              regionLabel.textContent = region;

              const statusSelect = document.createElement("select");
              statusSelectMap[region] = statusSelect;

              const currentStatus =
                typeof statusObj[region] === "string" ? statusObj[region] : "";

              const options = [...availableStatuses];
              if (!options.includes(currentStatus)) options.push(currentStatus);

              options.forEach((value) => {
                const opt = document.createElement("option");
                opt.value = value;
                opt.textContent = value === "" ? "未設定" : value;
                opt.selected = value === currentStatus;
                statusSelect.appendChild(opt);
              });

              statusSelect.addEventListener("change", function () {
                updateStatusMemory(selectedDate, shift, region, this.value);
                syncModifiedState(selectedDate, shift, region, this);
              });

              statusItem.appendChild(regionLabel);
              statusItem.appendChild(statusSelect);
              statusRow.appendChild(statusItem);
            });

            personSelect.addEventListener("change", function () {
              updateMemory(selectedDate, shift, this.value);
              syncModifiedState(selectedDate, shift, "人員", this);
            });

            clearBtn.addEventListener("click", function () {
              clearShiftData(
                selectedDate,
                shift,
                personSelect,
                statusSelectMap,
              );
            });

            group.appendChild(statusRow);
            wrapper.appendChild(group);
            body.appendChild(wrapper);

            // 依「實際與原始資料差異」重新套用標記
            if (isFieldActuallyModified(selectedDate, shift, "人員")) {
              syncModifiedState(selectedDate, shift, "人員", personSelect);
            }

            Object.keys(statusSelectMap).forEach((region) => {
              if (isFieldActuallyModified(selectedDate, shift, region)) {
                syncModifiedState(
                  selectedDate,
                  shift,
                  region,
                  statusSelectMap[region],
                );
              }
            });
          });

          section.appendChild(header);
          section.appendChild(body);
          container.appendChild(section);
        });

        refreshChangeSummary(selectedDate);
      }

      function updateMemory(date, shift, value) {
        if (!scheduleData[date]) {
          scheduleData[date] = createBlankDayTemplate();
        }

        const item = scheduleData[date][shift];

        if (
          !item ||
          typeof item !== "object" ||
          Array.isArray(item) ||
          !Object.prototype.hasOwnProperty.call(item, "name")
        ) {
          alert("此日期不是新版班表結構，無法編輯人員。");
          return;
        }

        item.name = value;
        isDirty = true;

        const dateStatus = document.getElementById("dateStatus");
        dateStatus.innerText = "💾 人員／地區狀態已更新記憶體，尚未匯出 JSON";
        dateStatus.style.color = "#d35400";
      }

      function updateStatusMemory(date, shift, region, value) {
        if (!scheduleData[date]) {
          scheduleData[date] = createBlankDayTemplate();
        }

        const item = scheduleData[date][shift];

        if (
          !item ||
          typeof item !== "object" ||
          Array.isArray(item) ||
          !item.status ||
          typeof item.status !== "object" ||
          Array.isArray(item.status)
        ) {
          alert("此日期不是新版班表結構，無法編輯地區狀態。");
          return;
        }

        item.status[region] = value;
        isDirty = true;

        const dateStatus = document.getElementById("dateStatus");
        dateStatus.innerText = "💾 人員／地區狀態已更新記憶體，尚未匯出 JSON";
        dateStatus.style.color = "#d35400";
      }

      function clearShiftData(date, shift, personSelect, statusSelectMap) {
        if (!scheduleData[date]) {
          scheduleData[date] = createBlankDayTemplate();
        }

        const item = scheduleData[date][shift];

        if (!item || typeof item !== "object" || Array.isArray(item)) {
          alert("此班別不是新版結構，無法清除。");
          return;
        }

        item.name = "";

        if (
          item.status &&
          typeof item.status === "object" &&
          !Array.isArray(item.status)
        ) {
          Object.keys(item.status).forEach((region) => {
            item.status[region] = "";
          });
        }

        if (personSelect) {
          personSelect.value = "";
          syncModifiedState(date, shift, "人員", personSelect);
        }

        Object.keys(statusSelectMap || {}).forEach((region) => {
          const select = statusSelectMap[region];
          select.value = "";
          syncModifiedState(date, shift, region, select);
        });

        isDirty = true;

        const dateStatus = document.getElementById("dateStatus");
        dateStatus.innerText = `🧹 已清除「${shift}」的人員與地區狀態，並更新記憶體`;
        dateStatus.style.color = "#c0392b";
      }
      function saveToMemory() {
        // 相容保留：現在每次 change 都已自動寫入記憶體。
      }

      function exportJSON() {
        if (!scheduleData || typeof scheduleData !== "object") {
          return alert("尚未載入 JSON 檔案");
        }

        const blob = new Blob([JSON.stringify(scheduleData, null, 2)], {
          type: "application/json;charset=utf-8",
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = loadedFileName;
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);

        isDirty = false;
        originalSnapshot = deepClone(scheduleData);
        modifiedByDate = {};
        refreshChangeSummary(currentDate);
        document
          .querySelectorAll(".field-modified")
          .forEach((el) => el.classList.remove("field-modified"));
        document
          .querySelectorAll(".is-modified")
          .forEach((el) => el.classList.remove("is-modified"));
        document.getElementById("status").innerText =
          `✅ 已匯出完整 JSON：${loadedFileName}`;
        document.getElementById("status").style.color = "green";
      }

      window.addEventListener("beforeunload", function (e) {
        if (!isDirty) return;
        e.preventDefault();
        e.returnValue = "";
      });
    </script>
